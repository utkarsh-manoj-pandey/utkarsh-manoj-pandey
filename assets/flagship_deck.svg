<svg width="900" height="440" viewBox="0 0 900 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="deckGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#131e30" />
    </pattern>

    <!-- Left Bus Gradient -->
    <linearGradient id="deckBusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseSignalDeck {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes pulseLiveLight {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #10b981); }
      50% { opacity: 0.4; filter: none; }
    }
    .deck-hdr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .p-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .p-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
    }
    .p-layer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
    .p-desc {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      fill: #94a3b8;
    }
    .bus-dot-move {
      animation: pulseSignalDeck 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .status-light {
      animation: pulseLiveLight 2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="438" rx="8" fill="url(#deckBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="436" rx="7" fill="url(#deckGrid)" />

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="898" height="30" rx="8" fill="#0b101a" />
  <line x1="1" y1="30" x2="899" y2="30" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="19" class="deck-hdr" fill="#38bdf8">FLAGSHIP SYSTEMS ARCHITECTURAL DECK // PRODUCTION SPECIFICATIONS</text>
  <text x="876" y="19" class="deck-hdr" fill="#64748b" text-anchor="end">5 ACTIVE REPOSITORIES</text>

  <!-- Left Vertical Bus Interconnect Spine -->
  <line x1="38" y1="52" x2="38" y2="395" stroke="url(#deckBusGrad)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="38" cy="52" r="3.5" fill="#38bdf8" class="bus-dot-move" />

  <!-- ===================================================================== -->
  <!-- CARD 01: PRIVACY-FIRST PERSONAL SPACE                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 42)">
    <rect x="0" y="0" width="820" height="66" rx="6" fill="#080e15" stroke="#113324" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#34d399" />
    
    <!-- Top Row inside Card -->
    <text x="16" y="22" class="p-layer" fill="#34d399">01 // LAYER: LOCAL-FIRST DESKTOP RUNTIME &amp; UTILITIES</text>
    <text x="16" y="42" class="p-title">Privacy-First Personal Space</text>
    <text x="250" y="42" class="p-tag" fill="#34d399">[Python 3.11+ • PySide/Qt • SQLite]</text>
    
    <!-- Right Status Pill -->
    <rect x="686" y="12" width="120" height="20" rx="10" fill="#0b1b13" stroke="#1b3d2c" stroke-width="1" />
    <circle cx="698" cy="22" r="3.5" fill="#10b981" class="status-light" />
    <text x="708" y="25" class="deck-hdr" fill="#34d399" font-size="8.5">ACTIVE BUILD</text>

    <!-- Capabilities Row -->
    <text x="16" y="58" class="p-desc">Subsystems: Offline Browser • Encrypted Notes • Media Player • Radio • Weather • Multi-Pass File Shredder</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 02: NØRVA                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 118)">
    <rect x="0" y="0" width="820" height="66" rx="6" fill="#080e15" stroke="#0e2a42" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#38bdf8" />

    <text x="16" y="22" class="p-layer" fill="#38bdf8">02 // LAYER: PRIVACY-HARDENED SECURE BROWSER ENGINE</text>
    <text x="16" y="42" class="p-title">NØRVA</text>
    <text x="80" y="42" class="p-tag" fill="#38bdf8">[Rust • WebKit/Engine • Tokio]</text>

    <rect x="686" y="12" width="120" height="20" rx="10" fill="#0a1926" stroke="#163854" stroke-width="1" />
    <circle cx="698" cy="22" r="3.5" fill="#38bdf8" class="status-light" />
    <text x="708" y="25" class="deck-hdr" fill="#38bdf8" font-size="8.5">ACTIVE BUILD</text>

    <text x="16" y="58" class="p-desc">Subsystems: Network Tracker Filter • Ephemeral Storage Sandboxes • Hardware Permission Gatekeeper • Telemetry HUD</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 03: KODAI                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 194)">
    <rect x="0" y="0" width="820" height="66" rx="6" fill="#080e15" stroke="#1e1b42" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#818cf8" />

    <text x="16" y="22" class="p-layer" fill="#818cf8">03 // LAYER: AUTONOMOUS AGENTIC CODE INTELLIGENCE</text>
    <text x="16" y="42" class="p-title">KODAI</text>
    <text x="78" y="42" class="p-tag" fill="#818cf8">[Rust • Tree-Sitter • Local/Remote LLM APIs]</text>

    <rect x="686" y="12" width="120" height="20" rx="10" fill="#13122b" stroke="#2a2559" stroke-width="1" />
    <circle cx="698" cy="22" r="3.5" fill="#818cf8" class="status-light" />
    <text x="708" y="25" class="deck-hdr" fill="#818cf8" font-size="8.5">ACTIVE BUILD</text>

    <text x="16" y="58" class="p-desc">Subsystems: Model-Agnostic Engine (Ollama/vLLM/APIs) • Sandboxed AST Tool Execution • Token Optimizer (&lt;4GB RAM)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 04: VECTRA                                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 270)">
    <rect x="0" y="0" width="820" height="66" rx="6" fill="#080e15" stroke="#0f2a4a" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#60a5fa" />

    <text x="16" y="22" class="p-layer" fill="#60a5fa">04 // LAYER: HIGH-PERFORMANCE MULTIMEDIA COMPUTING &amp; INSPECTION</text>
    <text x="16" y="42" class="p-title">VECTRA</text>
    <text x="86" y="42" class="p-tag" fill="#60a5fa">[C++20 • SIMD AVX2/NEON • Multi-Threaded]</text>

    <rect x="686" y="12" width="120" height="20" rx="10" fill="#0c1b30" stroke="#1a3b66" stroke-width="1" />
    <circle cx="698" cy="22" r="3.5" fill="#60a5fa" class="status-light" />
    <text x="708" y="25" class="deck-hdr" fill="#60a5fa" font-size="8.5">ACTIVE BUILD</text>

    <text x="16" y="58" class="p-desc">Subsystems: SIMD Accelerated Transcoder • Perceptual Rate Control (VMAF) • Container Parser • Subtitle OCR Sync</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 05: VERA-32                                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 346)">
    <rect x="0" y="0" width="820" height="66" rx="6" fill="#080e15" stroke="#33240a" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#f59e0b" />

    <text x="16" y="22" class="p-layer" fill="#f59e0b">05 // LAYER: HARDWARE RTL &amp; SILICON MICROCONTROLLER SOC</text>
    <text x="16" y="42" class="p-title">VERA-32</text>
    <text x="94" y="42" class="p-tag" fill="#f59e0b">[VHDL • RISC-V RV32I • Bare-Metal C • FPGA]</text>

    <rect x="686" y="12" width="120" height="20" rx="10" fill="#241705" stroke="#4d330c" stroke-width="1" />
    <circle cx="698" cy="22" r="3.5" fill="#f59e0b" class="status-light" />
    <text x="708" y="25" class="deck-hdr" fill="#f59e0b" font-size="8.5">ACTIVE BUILD</text>

    <text x="16" y="58" class="p-desc">Subsystems: Custom RV32I Core • Boot ROM &amp; SRAM Bus • Peripherals (UART, SPI, I²C, Timers, VIC) • FPGA Synthesis</text>
  </g>
</svg>
