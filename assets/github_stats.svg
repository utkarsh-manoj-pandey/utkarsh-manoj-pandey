<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    @keyframes drawWave {
      0% { stroke-dashoffset: 350; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -350; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 3.5; opacity: 1; filter: drop-shadow(0 0 4px #34d399); }
      50% { r: 5; opacity: 0.5; filter: none; }
    }
    .wave-path {
      stroke-dasharray: 350;
      animation: drawWave 5s linear infinite;
    }
    .node-anim {
      animation: pulseNode 2s infinite ease-in-out;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .text-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="198" rx="10" fill="url(#statsBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Section Header -->
  <rect x="1" y="1" width="898" height="36" rx="10" fill="#0d1117" fill-opacity="0.8" />
  <line x1="1" y1="37" x2="899" y2="37" stroke="#1e293b" stroke-width="1" />
  <text x="24" y="23" class="text-mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">TELEMETRY_ENGINE // REAL-TIME SYSTEM PERFORMANCE</text>
  <text x="876" y="23" class="text-mono" font-size="10" fill="#64748b" text-anchor="end">STATUS: CONTINUOUS INTEGRATION</text>

  <!-- Module 1: Core Statistics Metrics -->
  <g transform="translate(28, 54)">
    <text x="0" y="16" class="text-mono" font-size="9.5" fill="#64748b" letter-spacing="1">PRIMARY RUNTIME</text>
    <text x="0" y="42" class="text-sans" font-size="24" font-weight="800" fill="#f8fafc">Python 3.x</text>
    <text x="0" y="62" class="text-mono" font-size="10" fill="#38bdf8">3+ Years Advanced Production</text>

    <text x="0" y="94" class="text-mono" font-size="9.5" fill="#64748b" letter-spacing="1">RESEARCH DOMAIN</text>
    <text x="0" y="116" class="text-sans" font-size="14" font-weight="600" fill="#e2e8f0">AI/ML &amp; Quant Analytics</text>
    <text x="0" y="132" class="text-mono" font-size="10" fill="#94a3b8">Deep Learning • Recurrent Nets</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="280" y1="46" x2="280" y2="186" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Module 2: Tech Mastery Breakdown -->
  <g transform="translate(310, 54)">
    <text x="0" y="16" class="text-mono" font-size="9.5" fill="#64748b" letter-spacing="1">CAPABILITY SPECTRUM</text>

    <!-- Bar 1: Python & Backend -->
    <text x="0" y="40" class="text-mono" font-size="10" fill="#e2e8f0">Python Architecture &amp; APIs</text>
    <text x="230" y="40" class="text-mono" font-size="10" fill="#38bdf8" text-anchor="end">95%</text>
    <rect x="0" y="46" width="230" height="6" rx="3" fill="#131d2e" />
    <rect x="0" y="46" width="218" height="6" rx="3" fill="url(#cyanBar)" />

    <!-- Bar 2: Machine Learning & NLP -->
    <text x="0" y="74" class="text-mono" font-size="10" fill="#e2e8f0">Deep Learning &amp; NLP (LSTM)</text>
    <text x="230" y="74" class="text-mono" font-size="10" fill="#818cf8" text-anchor="end">88%</text>
    <rect x="0" y="80" width="230" height="6" rx="3" fill="#131d2e" />
    <rect x="0" y="80" width="202" height="6" rx="3" fill="url(#purpleBar)" />

    <!-- Bar 3: Data Analytics & Scraping -->
    <text x="0" y="108" class="text-mono" font-size="10" fill="#e2e8f0">Time-Series &amp; Data Mining</text>
    <text x="230" y="108" class="text-mono" font-size="10" fill="#34d399" text-anchor="end">90%</text>
    <rect x="0" y="114" width="230" height="6" rx="3" fill="#131d2e" />
    <rect x="0" y="114" width="207" height="6" rx="3" fill="url(#greenBar)" />
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="575" y1="46" x2="575" y2="186" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Module 3: Loss Convergence Sparkline & Live Telemetry -->
  <g transform="translate(605, 54)">
    <text x="0" y="16" class="text-mono" font-size="9.5" fill="#64748b" letter-spacing="1">MODEL CONVERGENCE</text>
    <text x="265" y="16" class="text-mono" font-size="9.5" fill="#34d399" text-anchor="end">● LOSS: 0.0012</text>

    <!-- Graph Box -->
    <rect x="0" y="28" width="265" height="96" rx="6" fill="#080c14" stroke="#162032" stroke-width="1" />

    <!-- Grid Lines inside chart -->
    <line x1="0" y1="60" x2="265" y2="60" stroke="#101928" stroke-width="0.8" stroke-dasharray="3 3" />
    <line x1="0" y1="92" x2="265" y2="92" stroke="#101928" stroke-width="0.8" stroke-dasharray="3 3" />
    <line x1="132" y1="28" x2="132" y2="124" stroke="#101928" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Animated Smooth Wave Path -->
    <path d="M 12 108 Q 50 100, 80 60 T 150 42 T 210 38 T 252 35" fill="none" stroke="url(#lineGrad)" stroke-width="2.2" class="wave-path" />
    <circle cx="252" cy="35" r="4" fill="#34d399" class="node-anim" />

    <text x="12" y="118" class="text-mono" font-size="8" fill="#475569">EPOCH 0</text>
    <text x="252" y="118" class="text-mono" font-size="8" fill="#34d399" text-anchor="end">OPTIMIZED (0.012)</text>
  </g>
</svg>
