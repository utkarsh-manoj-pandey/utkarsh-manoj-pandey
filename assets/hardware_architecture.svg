<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Dataflow pulse gradient -->
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <pattern id="dotMatrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#131c2e" />
    </pattern>
  </defs>

  <style>
    @keyframes flowDash {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowDash 2.5s linear infinite;
    }
    .f-tech {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .f-ui {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="228" rx="10" fill="url(#blueprintBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="226" rx="9" fill="url(#dotMatrix)" />

  <!-- Top Schematic Header -->
  <rect x="1" y="1" width="898" height="34" rx="10" fill="#080d18" fill-opacity="0.9" />
  <line x1="1" y1="35" x2="899" y2="35" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="22" class="f-tech" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SYSTEM_BLUEPRINT :: SIFRA AI AGENT &amp; PROMETHEUS OS RUNTIME</text>
  <text x="876" y="22" class="f-tech" font-size="10" fill="#64748b" text-anchor="end">ARCH: ARM64 + RISC-V + x86_64</text>

  <!-- Block 1: Edge Compute Hardware -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="254" height="156" rx="8" fill="#070b14" stroke="#1e2c44" stroke-width="1" />
    <rect x="0" y="0" width="254" height="26" rx="8" fill="#0d1526" />
    <line x1="0" y1="26" x2="254" y2="26" stroke="#1e2c44" stroke-width="0.8" />
    <text x="14" y="17" class="f-tech" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 01 // EDGE HARDWARE</text>

    <text x="14" y="48" class="f-ui" font-size="12" font-weight="600" fill="#f8fafc">Raspberry Pi 5 + M.2 NVMe</text>
    <text x="14" y="66" class="f-tech" font-size="9.5" fill="#94a3b8">Quad-Core ARM Cortex-A76</text>
    
    <text x="14" y="94" class="f-ui" font-size="11.5" font-weight="600" fill="#cbd5e1">Biometric Peripheral I/O</text>
    <text x="14" y="110" class="f-tech" font-size="9.5" fill="#64748b">Camera Module • Mic Array (ASR)</text>

    <text x="14" y="136" class="f-tech" font-size="9" fill="#38bdf8">PCIe Gen3 NVMe Weight Storage</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="280" y1="130" x2="320" y2="130" stroke="url(#flowCyan)" stroke-width="2" class="flow-line" />
  <polygon points="322,130 316,126 316,134" fill="#818cf8" />

  <!-- Block 2: Custom OS & Kernel -->
  <g transform="translate(324, 52)">
    <rect x="0" y="0" width="254" height="156" rx="8" fill="#070b14" stroke="#1e2c44" stroke-width="1" />
    <rect x="0" y="0" width="254" height="26" rx="8" fill="#0d1526" />
    <line x1="0" y1="26" x2="254" y2="26" stroke="#1e2c44" stroke-width="0.8" />
    <text x="14" y="17" class="f-tech" font-size="9" font-weight="700" fill="#818cf8" letter-spacing="1">LAYER 02 // OS &amp; KERNEL</text>

    <text x="14" y="48" class="f-ui" font-size="12" font-weight="600" fill="#f8fafc">Prometheus Operating System</text>
    <text x="14" y="66" class="f-tech" font-size="9.5" fill="#94a3b8">Customized Arch Linux Distribution</text>

    <text x="14" y="94" class="f-ui" font-size="11.5" font-weight="600" fill="#cbd5e1">Low-Level Optimization</text>
    <text x="14" y="110" class="f-tech" font-size="9.5" fill="#64748b">Shell Automation • Minimal Footprint</text>

    <text x="14" y="136" class="f-tech" font-size="9" fill="#818cf8">Microarchitecture: RISC-V &amp; ARM</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="580" y1="130" x2="620" y2="130" stroke="url(#flowCyan)" stroke-width="2" class="flow-line" />
  <polygon points="622,130 616,126 616,134" fill="#34d399" />

  <!-- Block 3: Neural & Multimodal Engine -->
  <g transform="translate(624, 52)">
    <rect x="0" y="0" width="252" height="156" rx="8" fill="#070b14" stroke="#1e2c44" stroke-width="1" />
    <rect x="0" y="0" width="252" height="26" rx="8" fill="#0d1526" />
    <line x1="0" y1="26" x2="252" y2="26" stroke="#1e2c44" stroke-width="0.8" />
    <text x="14" y="17" class="f-tech" font-size="9" font-weight="700" fill="#34d399" letter-spacing="1">LAYER 03 // INTELLIGENT AGENT</text>

    <text x="14" y="48" class="f-ui" font-size="12" font-weight="600" fill="#f8fafc">SIFRA Voice Assistant Engine</text>
    <text x="14" y="66" class="f-tech" font-size="9.5" fill="#94a3b8">Fine-Tuned Llama 3.3 &amp; DeepSeek R1</text>

    <text x="14" y="94" class="f-ui" font-size="11.5" font-weight="600" fill="#cbd5e1">Multimodal Automation</text>
    <text x="14" y="110" class="f-tech" font-size="9.5" fill="#64748b">Face Biometrics • Playwright Web Control</text>

    <text x="14" y="136" class="f-tech" font-size="9" fill="#34d399">Continuous Real-Time ASR Engine</text>
  </g>
</svg>
