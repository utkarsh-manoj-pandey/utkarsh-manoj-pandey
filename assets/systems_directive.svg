<svg width="900" height="84" viewBox="0 0 900 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="dirBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .pulse-dot { animation: pulseDot 2s infinite ease-in-out; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="898" height="82" rx="10" fill="url(#dirBg)" stroke="url(#dirBorder)" stroke-width="1.2" />

  <!-- Top Strip Header -->
  <g transform="translate(20, 16)">
    <circle cx="4" cy="5" r="3.5" fill="#38bdf8" class="pulse-dot" />
    <text x="16" y="9" class="font-mono" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1">SYSTEMS_MISSION // FIRST-PRINCIPLES ENGINEERING DIRECTIVES</text>
    <text x="860" y="9" class="font-mono" font-size="9" fill="#64748b" text-anchor="end">LAB MANIFESTO</text>
  </g>

  <!-- 3 Engineering Pillars -->
  <g transform="translate(20, 38)">
    <!-- Pillar 1: Silicon & RTL -->
    <g transform="translate(0, 0)">
      <rect width="276" height="34" rx="6" fill="#0c1426" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="15" class="font-mono" font-size="9.5" fill="#f59e0b" font-weight="700">01 // SILICON &amp; RTL</text>
      <text x="12" y="27" class="font-sans" font-size="9" fill="#94a3b8">RV32I Core • GHDL RTL • FPGA Targets</text>
    </g>

    <!-- Pillar 2: Low-Latency Runtimes -->
    <g transform="translate(292, 0)">
      <rect width="276" height="34" rx="6" fill="#0c1426" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="15" class="font-mono" font-size="9.5" fill="#38bdf8" font-weight="700">02 // ZERO-GC RUNTIMES</text>
      <text x="12" y="27" class="font-sans" font-size="9" fill="#94a3b8">Rust &amp; Modern C++20 • SIMD AVX2</text>
    </g>

    <!-- Pillar 3: Local-First Privacy -->
    <g transform="translate(584, 0)">
      <rect width="276" height="34" rx="6" fill="#0c1426" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="15" class="font-mono" font-size="9.5" fill="#10b981" font-weight="700">03 // LOCAL-FIRST PRIVACY</text>
      <text x="12" y="27" class="font-sans" font-size="9" fill="#94a3b8">Encrypted Storage • Sandboxed Coding AI</text>
    </g>
  </g>
</svg>
