<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Seamless Background Gradient blending into GitHub #0d1117 -->
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="auraStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Center Ambient Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fine Circuit Pattern -->
    <pattern id="gridFine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141f33" stroke-width="0.6" />
      <circle cx="10" cy="10" r="0.5" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="metallicText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Laser Sweep Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseNodeLive {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.35; transform: scale(0.85); filter: none; }
    }
    @keyframes laserSweepBeam {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(950px); }
    }
    .status-pulse-dot {
      transform-origin: 846px 19px;
      animation: pulseNodeLive 2.2s infinite ease-in-out;
    }
    .laser-beam-line {
      animation: laserSweepBeam 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .font-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="898" height="218" rx="10" fill="url(#heroDarkBg)" stroke="url(#auraStroke)" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="216" rx="9" fill="url(#gridFine)" />
  <circle cx="450" cy="95" r="220" fill="url(#centerGlow)" />

  <!-- Top Window Chrome Bar -->
  <rect x="1" y="1" width="898" height="38" rx="10" fill="#090d15" fill-opacity="0.95" />
  <line x1="1" y1="38" x2="899" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="24" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="40" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="56" cy="19" r="4.5" fill="#10b981" />

  <!-- Terminal Breadcrumb -->
  <text x="80" y="23" class="font-code" font-size="10.5" fill="#64748b" letter-spacing="1">~/utkarsh-manoj-pandey (sys-silicon-lab) [main*]</text>

  <!-- Live Status Beacon -->
  <circle cx="846" cy="19" r="4" fill="#10b981" class="status-pulse-dot" />
  <text x="834" y="23" class="font-code" font-size="10" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.2">SYSTEM RUNTIME: ONLINE</text>

  <!-- Laser Sweep Line -->
  <g clip-path="url(#laserClipLine)">
    <clipPath id="laserClipLine">
      <rect x="1" y="38" width="898" height="2" />
    </clipPath>
    <rect x="0" y="38" width="240" height="2" fill="url(#laserBeam)" class="laser-beam-line" />
  </g>

  <!-- Hero Identity Content (Centered) -->
  <g transform="translate(450, 80)" text-anchor="middle">
    <!-- Domain Tag Pill -->
    <rect x="-195" y="-18" width="390" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-3" class="font-code" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1.6">SYSTEMS ARCHITECT • SILICON RTL • AGENTIC AI</text>

    <!-- Main Name Title -->
    <text x="0" y="38" class="font-display" font-size="34" font-weight="800" fill="url(#metallicText)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Mission Subtitle -->
    <text x="0" y="62" class="font-code" font-size="11" fill="#94a3b8" letter-spacing="0.5">Engineering zero-compromise systems from 32-bit RISC-V silicon to low-RAM AI agents &amp; local-first runtimes.</text>
  </g>

  <!-- Bottom Systems Metrics Bar (Clean Systems Attributes, No Project Repetition) -->
  <g transform="translate(20, 164)">
    <!-- Metric 1: Target Architectures -->
    <rect x="0" y="0" width="205" height="42" rx="6" fill="#070c14" stroke="#152136" stroke-width="1" />
    <text x="12" y="16" class="font-code" font-size="8.5" fill="#64748b" font-weight="700" letter-spacing="0.8">TARGET ARCHITECTURES</text>
    <text x="12" y="31" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">RV32I • x86_64 • ARM64</text>

    <!-- Metric 2: Core Disciplines -->
    <g transform="translate(217, 0)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#070c14" stroke="#152136" stroke-width="1" />
      <text x="12" y="16" class="font-code" font-size="8.5" fill="#64748b" font-weight="700" letter-spacing="0.8">ENGINEERING PILLARS</text>
      <text x="12" y="31" class="font-display" font-size="11" fill="#38bdf8" font-weight="600">Silicon RTL • Agents • Media</text>
    </g>

    <!-- Metric 3: Privacy Protocol -->
    <g transform="translate(434, 0)">
      <rect x="0" y="0" width="205" height="42" rx="6" fill="#070c14" stroke="#152136" stroke-width="1" />
      <text x="12" y="16" class="font-code" font-size="8.5" fill="#64748b" font-weight="700" letter-spacing="0.8">SYSTEM ETHOS</text>
      <text x="12" y="31" class="font-display" font-size="11" fill="#34d399" font-weight="600">Local-First • Zero Telemetry</text>
    </g>

    <!-- Metric 4: Runtime Environment -->
    <g transform="translate(651, 0)">
      <rect x="0" y="0" width="209" height="42" rx="6" fill="#070c14" stroke="#152136" stroke-width="1" />
      <text x="12" y="16" class="font-code" font-size="8.5" fill="#64748b" font-weight="700" letter-spacing="0.8">EXECUTION ENVIRONMENT</text>
      <text x="12" y="31" class="font-display" font-size="11" fill="#818cf8" font-weight="600">Linux • POSIX • Bare Metal</text>
    </g>
  </g>
</svg>
