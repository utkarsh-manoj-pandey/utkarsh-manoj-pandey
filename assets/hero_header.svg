<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient blending seamlessly into GitHub #0d1117 -->
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="auraStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="centerAuraLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fine Grid Pattern -->
    <pattern id="gridFine" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162235" stroke-width="0.6" />
      <circle cx="12" cy="12" r="0.5" fill="#1e293b" opacity="0.5" />
    </pattern>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="metallicText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseNodeLive {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.35; transform: scale(0.85); filter: none; }
    }
    @keyframes laserSweepBeam {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(950px); }
    }
    .status-pulse-dot {
      transform-origin: 846px 20px;
      animation: pulseNodeLive 2.2s infinite ease-in-out;
    }
    .laser-beam-line {
      animation: laserSweepBeam 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .font-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="238" rx="10" fill="url(#heroDarkBg)" stroke="url(#auraStroke)" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="236" rx="9" fill="url(#gridFine)" />
  <circle cx="450" cy="105" r="240" fill="url(#centerAuraLight)" />

  <!-- Window Chrome Header Bar -->
  <rect x="1" y="1" width="898" height="38" rx="10" fill="#0b0f17" fill-opacity="0.95" />
  <line x1="1" y1="38" x2="899" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="24" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="40" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="56" cy="19" r="4.5" fill="#10b981" />

  <!-- Terminal Breadcrumb -->
  <text x="80" y="23" class="font-code" font-size="10.5" fill="#64748b" letter-spacing="1">utkarsh-manoj-pandey // systems-engineering-lab</text>

  <!-- Live Status Beacon -->
  <circle cx="846" cy="19" r="4" fill="#10b981" class="status-pulse-dot" />
  <text x="834" y="23" class="font-code" font-size="10" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.2">5 FLAGSHIP SYSTEMS ACTIVE</text>

  <!-- Laser Line -->
  <g clip-path="url(#laserClipLine)">
    <clipPath id="laserClipLine">
      <rect x="1" y="38" width="898" height="2" />
    </clipPath>
    <rect x="0" y="38" width="240" height="2" fill="url(#laserStroke)" class="laser-beam-line" />
  </g>

  <!-- Hero Identity Content (Centered) -->
  <g transform="translate(450, 84)" text-anchor="middle">
    <!-- Domain Tag -->
    <rect x="-190" y="-18" width="380" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-3" class="font-code" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1.6">SYSTEMS • SILICON • AI AGENTS • PRIVACY</text>

    <!-- Main Title -->
    <text x="0" y="38" class="font-display" font-size="34" font-weight="800" fill="url(#metallicText)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Tagline Subtitle -->
    <text x="0" y="62" class="font-code" font-size="11" fill="#94a3b8" letter-spacing="0.5">Engineering zero-compromise systems from 32-bit RISC-V silicon to low-RAM AI agents &amp; local-first runtimes.</text>
  </g>

  <!-- 5 Flagship Systems Horizontal Status Bar (Bottom Row) -->
  <!-- Chip 1: Personal Space -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="164" height="54" rx="6" fill="#070c14" stroke="#102a20" stroke-width="1" />
    <text x="12" y="18" class="font-code" font-size="9" fill="#34d399" font-weight="700" letter-spacing="0.8">01 / PYTHON</text>
    <text x="12" y="34" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">Personal Space</text>
    <text x="12" y="47" class="font-code" font-size="8.5" fill="#64748b">Local-First Desktop</text>
  </g>

  <!-- Chip 2: NØRVA -->
  <g transform="translate(194, 168)">
    <rect x="0" y="0" width="164" height="54" rx="6" fill="#070c14" stroke="#0e2438" stroke-width="1" />
    <text x="12" y="18" class="font-code" font-size="9" fill="#38bdf8" font-weight="700" letter-spacing="0.8">02 / RUST</text>
    <text x="12" y="34" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">NØRVA</text>
    <text x="12" y="47" class="font-code" font-size="8.5" fill="#64748b">Privacy Web Browser</text>
  </g>

  <!-- Chip 3: KODAI -->
  <g transform="translate(368, 168)">
    <rect x="0" y="0" width="164" height="54" rx="6" fill="#070c14" stroke="#1c1938" stroke-width="1" />
    <text x="12" y="18" class="font-code" font-size="9" fill="#818cf8" font-weight="700" letter-spacing="0.8">03 / RUST</text>
    <text x="12" y="34" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">KODAI</text>
    <text x="12" y="47" class="font-code" font-size="8.5" fill="#64748b">Coding AI Agent</text>
  </g>

  <!-- Chip 4: VECTRA -->
  <g transform="translate(542, 168)">
    <rect x="0" y="0" width="164" height="54" rx="6" fill="#070c14" stroke="#0f2642" stroke-width="1" />
    <text x="12" y="18" class="font-code" font-size="9" fill="#60a5fa" font-weight="700" letter-spacing="0.8">04 / C++</text>
    <text x="12" y="34" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">VECTRA</text>
    <text x="12" y="47" class="font-code" font-size="8.5" fill="#64748b">Media Engine &amp; Suite</text>
  </g>

  <!-- Chip 5: VERA-32 -->
  <g transform="translate(716, 168)">
    <rect x="0" y="0" width="164" height="54" rx="6" fill="#070c14" stroke="#281e0a" stroke-width="1" />
    <text x="12" y="18" class="font-code" font-size="9" fill="#f59e0b" font-weight="700" letter-spacing="0.8">05 / VHDL</text>
    <text x="12" y="34" class="font-display" font-size="11" fill="#f8fafc" font-weight="600">VERA-32</text>
    <text x="12" y="47" class="font-code" font-size="8.5" fill="#64748b">32b RISC-V SoC</text>
  </g>
</svg>
