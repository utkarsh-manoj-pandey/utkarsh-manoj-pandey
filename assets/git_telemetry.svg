<svg width="440" height="195" viewBox="0 0 440 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
  </defs>

  <style>
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .live { animation: led 1.6s infinite ease-in-out; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Frame -->
  <rect x="0" y="0" width="440" height="195" rx="10" fill="url(#tBg)" stroke="#1e293b" stroke-width="0.8" />

  <!-- Header -->
  <rect x="0" y="0" width="440" height="30" rx="10" fill="#050911" fill-opacity="0.97" />
  <line x1="0" y1="30" x2="440" y2="30" stroke="#1e293b" stroke-width="0.8" />

  <circle cx="14" cy="15" r="3" fill="#ef4444" />
  <circle cx="26" cy="15" r="3" fill="#f59e0b" />
  <circle cx="38" cy="15" r="3" fill="#10b981" />

  <text x="52" y="19" class="mono" font-size="9.5" fill="#475569" font-weight="600">SYSTEMS_TELEMETRY // GIT OPS</text>
  <circle cx="420" cy="15" r="2.5" fill="#10b981" class="live" />
  <text x="410" y="19" class="mono" font-size="8" fill="#10b981" text-anchor="end" font-weight="600">ACTIVE</text>

  <!-- Metrics -->
  <g transform="translate(16, 44)">
