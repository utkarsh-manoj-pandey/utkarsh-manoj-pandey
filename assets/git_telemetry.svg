      <text x="10" y="18" class="mono" font-size="8.5" fill="#64748b">
        <tspan fill="#38bdf8">CI/CD: Actions</tspan> · <tspan fill="#94a3b8">POSIX Linux</tspan> · <tspan fill="#a78bfa">Daily Sync</tspan> · <tspan fill="#10b981">Build: Passing</tspan>
