    <!-- Row 2 -->
    <text y="34" class="mono" font-size="9" fill="#475569">HARDWARE TRACK:</text>
    <text x="148" y="34" class="mono" font-size="9.5" fill="#f59e0b" font-weight="600">32-Bit RV32I Core &amp; RTL</text>

    <!-- Row 3 -->
    <text y="56" class="mono" font-size="9" fill="#475569">SYSTEMS RUNTIMES:</text>
    <text x="148" y="56" class="mono" font-size="9.5" fill="#38bdf8" font-weight="600">Rust, Modern C++20, Python</text>

