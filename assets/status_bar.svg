<svg width="900" height="42" viewBox="0 0 900 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 4px #10b981); }
      50% { opacity: 0.3; transform: scale(0.85); filter: none; }
    }
    .status-dot {
      transform-origin: 736px 21px;
      animation: pulseLive 2s infinite ease-in-out;
    }
    .t-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .t-accent {
      fill: #38bdf8;
      font-weight: 600;
    }
  </style>

  <!-- Base Capsule Frame -->
  <rect x="1" y="1" width="898" height="40" rx="8" fill="url(#barBg)" stroke="#1e293b" stroke-width="1" />

  <!-- Item 1: Role -->
  <g transform="translate(24, 25)">
    <text class="t-mono">ROLE: <tspan class="t-accent">AI &amp; DATA ENGINEER</tspan></text>
  </g>
  <line x1="220" y1="10" x2="220" y2="32" stroke="#1e293b" stroke-width="1" />

  <!-- Item 2: Experience -->
  <g transform="translate(242, 25)">
    <text class="t-mono">ENGINEERING: <tspan class="t-accent">3+ YRS PYTHON</tspan></text>
  </g>
  <line x1="435" y1="10" x2="435" y2="32" stroke="#1e293b" stroke-width="1" />

  <!-- Item 3: Core Specialization -->
  <g transform="translate(458, 25)">
    <text class="t-mono">PIPELINES: <tspan fill="#818cf8" font-weight="600">DEEP LEARNING &amp; QUANT</tspan></text>
  </g>
  <line x1="710" y1="10" x2="710" y2="32" stroke="#1e293b" stroke-width="1" />

  <!-- Item 4: Active Status -->
  <g transform="translate(730, 25)">
    <circle cx="6" cy="-4" r="3.5" fill="#10b981" class="status-dot" />
    <text x="18" class="t-mono" fill="#10b981" font-weight="600">OPEN TO WORK</text>
  </g>
</svg>
