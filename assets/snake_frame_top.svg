<svg width="900" height="40" viewBox="0 0 900 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snkTopBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e1b" />
      <stop offset="50%" stop-color="#0d1728" />
      <stop offset="100%" stop-color="#080e1b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseEmerald { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse-emerald { animation: pulseEmerald 1.8s infinite ease-in-out; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame Top -->
  <rect x="1" y="1" width="898" height="38" rx="8" fill="url(#snkTopBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Mac / Unix Controls -->
  <circle cx="20" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="20" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="20" r="4.5" fill="#10b981" />

  <!-- Title -->
  <text x="76" y="24" class="font-mono" font-size="11" fill="#10b981" font-weight="700" letter-spacing="1">COMMIT_STREAM // RETRO CONTRIBUTION GRID SNAKE EATER</text>

  <!-- Right: Status -->
  <circle cx="850" cy="20" r="3.5" fill="#10b981" class="pulse-emerald" />
  <text x="838" y="24" class="font-mono" font-size="9.5" fill="#38bdf8" text-anchor="end" font-weight="600">LIVE SNAKE ENGINE</text>
</svg>
