<svg width="900" height="540" viewBox="0 0 900 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="roadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#131e30" />
    </pattern>

    <!-- Vertical Spine Bus Gradient -->
    <linearGradient id="roadSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes busPacketSweep {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(430px); opacity: 0; }
    }
    @keyframes pulsePhaseLight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .road-hdr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .p-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .p-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
    }
    .p-layer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .p-desc {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      fill: #cbd5e1;
    }
    .p-specs {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8.5px;
      fill: #64748b;
    }
    .bus-packet {
      animation: busPacketSweep 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .phase-beacon {
      animation: pulsePhaseLight 2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="538" rx="8" fill="url(#roadBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="536" rx="7" fill="url(#roadGrid)" />

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="898" height="32" rx="8" fill="#0b101a" />
  <line x1="1" y1="32" x2="899" y2="32" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="20" class="road-hdr" fill="#38bdf8">FLAGSHIP SYSTEMS ROADMAP // 5 PLANNED REPOSITORIES (UNDER ACTIVE DEVELOPMENT)</text>
  <text x="876" y="20" class="road-hdr" fill="#64748b" text-anchor="end">PRODUCTION SPECIFICATIONS</text>

  <!-- Left Vertical Bus Interconnect Spine -->
  <line x1="38" y1="55" x2="38" y2="495" stroke="url(#roadSpineGrad)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="38" cy="55" r="3.5" fill="#38bdf8" class="bus-packet" />

  <!-- ===================================================================== -->
  <!-- CARD 01: PRIVACY-FIRST PERSONAL SPACE                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 44)">
    <rect x="0" y="0" width="820" height="86" rx="6" fill="#080e15" stroke="#113324" stroke-width="1" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#34d399" />
    
    <!-- Row 1: Layer & Language & Phase Pill -->
    <text x="16" y="20" class="p-layer" fill="#34d399">01 // LAYER: LOCAL-FIRST DESKTOP RUNTIME</text>
    <rect x="686" y="10" width="120" height="20" rx="10" fill="#0b1b13" stroke="#1b3d2c" stroke-width="1" />
    <circle cx="698" cy="20" r="3.5" fill="#34d399" class="phase-beacon" />
    <text x="708" y="23" class="road-hdr" fill="#34d399" font-size="8">PLANNING PHASE</text>

    <!-- Row 2: Title & Language -->
    <text x="16" y="38" class="p-name">Privacy-First Personal Space</text>
    <text x="240" y="38" class="p-tag" fill="#34d399">[Language: Python]</text>

    <!-- Row 3: What We're Building -->
    <text x="16" y="56" class="p-desc">A complete local-first desktop application with browser, notes, calendar, media, documents, radio, weather, news, file utilities, privacy features, etc.</text>

    <!-- Row 4: Specs -->
    <text x="16" y="74" class="p-specs">Architecture: Local-First Workspace • Encrypted SQLite Storage • Zero External Telemetry • Python 3.11+ / PySide</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 02: NØRVA                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 142)">
    <rect x="0" y="0" width="820" height="86" rx="6" fill="#080e15" stroke="#0e2a42" stroke-width="1" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#38bdf8" />

    <text x="16" y="20" class="p-layer" fill="#38bdf8">02 // LAYER: PRIVACY-HARDENED SECURE BROWSER ENGINE</text>
    <rect x="686" y="10" width="120" height="20" rx="10" fill="#0a1926" stroke="#163854" stroke-width="1" />
    <circle cx="698" cy="20" r="3.5" fill="#38bdf8" class="phase-beacon" />
    <text x="708" y="23" class="road-hdr" fill="#38bdf8" font-size="8">PLANNING PHASE</text>

    <text x="16" y="38" class="p-name">NØRVA</text>
    <text x="80" y="38" class="p-tag" fill="#38bdf8">[Language: Rust]</text>

    <text x="16" y="56" class="p-desc">A lightweight, privacy-focused web browser with tracker protection, isolated sessions, permission controls, privacy dashboard, downloads, history, etc.</text>

    <text x="16" y="74" class="p-specs">Architecture: Network-Level Tracker Filter • Ephemeral Storage Sandboxes • Hardware Permission Gatekeeper • Rust Web Engine</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 03: KODAI                                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 240)">
    <rect x="0" y="0" width="820" height="86" rx="6" fill="#080e15" stroke="#1e1b42" stroke-width="1" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#818cf8" />

    <text x="16" y="20" class="p-layer" fill="#818cf8">03 // LAYER: AUTONOMOUS AGENTIC CODE INTELLIGENCE</text>
    <rect x="686" y="10" width="120" height="20" rx="10" fill="#13122b" stroke="#2a2559" stroke-width="1" />
    <circle cx="698" cy="20" r="3.5" fill="#818cf8" class="phase-beacon" />
    <text x="708" y="23" class="road-hdr" fill="#818cf8" font-size="8">PLANNING PHASE</text>

    <text x="16" y="38" class="p-name">KODAI</text>
    <text x="76" y="38" class="p-tag" fill="#818cf8">[Language: Rust]</text>

    <text x="16" y="56" class="p-desc">A low-RAM, model-agnostic coding AI agent that can connect to local coding LLMs or external LLM APIs and operate on real codebases through controlled tools.</text>

    <text x="16" y="74" class="p-specs">Architecture: Model-Agnostic LLM Connectivity (Ollama / vLLM / APIs) • Sandboxed Tree-Sitter AST Diffing • Low-RAM (&lt;4GB)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 04: VECTRA                                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 338)">
    <rect x="0" y="0" width="820" height="86" rx="6" fill="#080e15" stroke="#0f2a4a" stroke-width="1" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#60a5fa" />

    <text x="16" y="20" class="p-layer" fill="#60a5fa">04 // LAYER: HIGH-PERFORMANCE MULTIMEDIA COMPUTING &amp; INSPECTION</text>
    <rect x="686" y="10" width="120" height="20" rx="10" fill="#0c1b30" stroke="#1a3b66" stroke-width="1" />
    <circle cx="698" cy="20" r="3.5" fill="#60a5fa" class="phase-beacon" />
    <text x="708" y="23" class="road-hdr" fill="#60a5fa" font-size="8">PLANNING PHASE</text>

    <text x="16" y="38" class="p-name">VECTRA</text>
    <text x="82" y="38" class="p-tag" fill="#60a5fa">[Language: C++]</text>

    <text x="16" y="56" class="p-desc">A high-performance media processing/analysis suite for video/audio conversion, compression, metadata, subtitles, batch processing, media inspection, etc.</text>

    <text x="16" y="74" class="p-specs">Architecture: SIMD Accelerated Transcoding (AVX2/NEON) • Perceptual Rate Control • Container Parser • Subtitle OCR Sync • Modern C++20</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CARD 05: VERA-32                                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(56, 436)">
    <rect x="0" y="0" width="820" height="86" rx="6" fill="#080e15" stroke="#33240a" stroke-width="1" />
    <rect x="0" y="0" width="4" height="86" rx="2" fill="#f59e0b" />

    <text x="16" y="20" class="p-layer" fill="#f59e0b">05 // LAYER: HARDWARE RTL &amp; SILICON MICROCONTROLLER SOC</text>
    <rect x="686" y="10" width="120" height="20" rx="10" fill="#241705" stroke="#4d330c" stroke-width="1" />
    <circle cx="698" cy="20" r="3.5" fill="#f59e0b" class="phase-beacon" />
    <text x="708" y="23" class="road-hdr" fill="#f59e0b" font-size="8">PLANNING PHASE</text>

    <text x="16" y="38" class="p-name">VERA-32</text>
    <text x="92" y="38" class="p-tag" fill="#f59e0b">[Language: VHDL + RISC-V]</text>

    <text x="16" y="56" class="p-desc">Our own 32-bit RISC-V microcontroller SoC: CPU core, ROM, SRAM, bus, GPIO, UART, SPI, I²C, timers, interrupts, firmware support, simulation and FPGA deployment.</text>

    <text x="16" y="74" class="p-specs">Architecture: Synthesizable RV32I Core • Boot ROM &amp; SRAM Bus Interconnect • Memory-Mapped Peripherals • Bare-Metal C • FPGA Deployment</text>
  </g>
</svg>
