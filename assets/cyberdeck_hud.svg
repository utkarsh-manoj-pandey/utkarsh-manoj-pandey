<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Carbon Gradient -->
    <linearGradient id="cyberCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>

    <!-- Titanium Ice Glowing Border -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Circuit Grid Pattern -->
    <pattern id="circuitGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0e1726" stroke-width="0.8" />
      <circle cx="15" cy="15" r="0.8" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Name Metallic Gradient -->
    <linearGradient id="silverName" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.3; transform: scale(0.85); filter: none; }
    }
    @keyframes sweepLaser {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(950px); }
    }
    .status-pulse {
      transform-origin: 846px 22px;
      animation: livePulse 2s infinite ease-in-out;
    }
    .laser-beam {
      animation: sweepLaser 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .f-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .f-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="318" rx="14" fill="url(#cyberCanvas)" stroke="url(#cyberBorder)" stroke-width="1.4" />
  <rect x="2" y="2" width="896" height="316" rx="13" fill="url(#circuitGrid)" />
  <circle cx="450" cy="140" r="320" fill="url(#coreAura)" />

  <!-- Terminal Window Chrome Header -->
  <rect x="1" y="1" width="898" height="44" rx="14" fill="#070a12" fill-opacity="0.9" />
  <line x1="1" y1="44" x2="899" y2="44" stroke="#1a2333" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="22" r="5" fill="#ef4444" />
  <circle cx="46" cy="22" r="5" fill="#f59e0b" />
  <circle cx="64" cy="22" r="5" fill="#10b981" />

  <!-- Window Breadcrumb -->
  <text x="96" y="26" class="f-mono" font-size="11" fill="#64748b" letter-spacing="1">PROMETHEUS-OS :: KERNEL v6.12-ARM64 // UTKARSH_DEV_RUNTIME</text>

  <!-- Status Indicator -->
  <circle cx="846" cy="22" r="4" fill="#10b981" class="status-pulse" />
  <text x="834" y="26" class="f-mono" font-size="11" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.5">SYSTEM ACTIVE</text>

  <!-- Animated Laser Scanline beneath title bar -->
  <g clip-path="url(#laserClip)">
    <clipPath id="laserClip">
      <rect x="1" y="44" width="898" height="2" />
    </clipPath>
    <rect x="0" y="44" width="280" height="2" fill="#38bdf8" opacity="0.8" class="laser-beam" />
  </g>

  <!-- Center Identity Block (Centered at x=450) -->
  <g transform="translate(450, 108)" text-anchor="middle">
    <!-- Role Badge -->
    <rect x="-210" y="-22" width="420" height="28" rx="14" fill="#0c1322" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-4" class="f-mono" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="2">AI &amp; INTELLIGENT SYSTEMS DEVELOPER</text>

    <!-- Main Name Title -->
    <text x="0" y="48" class="f-sans" font-size="44" font-weight="800" fill="url(#silverName)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Engineering Subtitle -->
    <text x="0" y="78" class="f-mono" font-size="11.5" fill="#94a3b8" letter-spacing="1.2">Embedded Linux Architect • Autonomous Voice Agents • Edge LLM Systems</text>
  </g>

  <!-- 4 Hardware & Architecture Telemetry Boxes (Bottom Row) -->
  <!-- Box 1: SIFRA & Edge AI -->
  <g transform="translate(24, 224)">
    <rect x="0" y="0" width="204" height="72" rx="8" fill="#060910" stroke="#162032" stroke-width="1" />
    <text x="14" y="22" class="f-mono" font-size="9" fill="#38bdf8" font-weight="700" letter-spacing="1">EDGE AI &amp; MULTIMODAL</text>
    <text x="14" y="42" class="f-sans" font-size="12" fill="#f8fafc" font-weight="600">SIFRA &amp; Llama 3.3</text>
    <text x="14" y="58" class="f-mono" font-size="9.5" fill="#64748b">DeepSeek R1 • ASR • Vision</text>
  </g>

  <!-- Box 2: Prometheus OS & Kernel -->
  <g transform="translate(240, 224)">
    <rect x="0" y="0" width="204" height="72" rx="8" fill="#060910" stroke="#162032" stroke-width="1" />
    <text x="14" y="22" class="f-mono" font-size="9" fill="#818cf8" font-weight="700" letter-spacing="1">CUSTOM OS &amp; KERNEL</text>
    <text x="14" y="42" class="f-sans" font-size="12" fill="#f8fafc" font-weight="600">Prometheus Operating System</text>
    <text x="14" y="58" class="f-mono" font-size="9.5" fill="#64748b">Arch Linux • ARM64 • x86_64</text>
  </g>

  <!-- Box 3: Embedded & RISC-V -->
  <g transform="translate(456, 224)">
    <rect x="0" y="0" width="204" height="72" rx="8" fill="#060910" stroke="#162032" stroke-width="1" />
    <text x="14" y="22" class="f-mono" font-size="9" fill="#34d399" font-weight="700" letter-spacing="1">HARDWARE &amp; ARCHITECTURE</text>
    <text x="14" y="42" class="f-sans" font-size="12" fill="#f8fafc" font-weight="600">Raspberry Pi 5 + NVMe</text>
    <text x="14" y="58" class="f-mono" font-size="9.5" fill="#64748b">RISC-V ISA • Microarchitecture</text>
  </g>

  <!-- Box 4: Polyglot Systems -->
  <g transform="translate(672, 224)">
    <rect x="0" y="0" width="204" height="72" rx="8" fill="#060910" stroke="#162032" stroke-width="1" />
    <text x="14" y="22" class="f-mono" font-size="9" fill="#f59e0b" font-weight="700" letter-spacing="1">SYSTEMS LANGUAGES</text>
    <text x="14" y="42" class="f-sans" font-size="12" fill="#f8fafc" font-weight="600">C • C++ • Rust • Go</text>
    <text x="14" y="58" class="f-mono" font-size="9.5" fill="#64748b">Python • Julia • Bash • SQL</text>
  </g>
</svg>
