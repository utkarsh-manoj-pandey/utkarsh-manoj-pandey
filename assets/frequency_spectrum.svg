<svg width="900" height="110" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="freqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="freqGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#121e30" stroke-width="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes barBounce1 { 0%, 100% { height: 12px; } 50% { height: 46px; } }
    @keyframes barBounce2 { 0%, 100% { height: 28px; } 50% { height: 14px; } }
    @keyframes barBounce3 { 0%, 100% { height: 38px; } 50% { height: 52px; } }
    @keyframes barBounce4 { 0%, 100% { height: 18px; } 50% { height: 36px; } }
    @keyframes barBounce5 { 0%, 100% { height: 44px; } 50% { height: 20px; } }
    .freq-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .b1 { animation: barBounce1 1.4s infinite ease-in-out; }
    .b2 { animation: barBounce2 1.1s infinite ease-in-out; }
    .b3 { animation: barBounce3 1.6s infinite ease-in-out; }
    .b4 { animation: barBounce4 1.3s infinite ease-in-out; }
    .b5 { animation: barBounce5 1.5s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="108" rx="8" fill="url(#freqBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="106" rx="7" fill="url(#freqGrid)" />

  <!-- Top Bar -->
  <rect x="1" y="1" width="898" height="26" rx="8" fill="#0b101a" />
  <line x1="1" y1="26" x2="899" y2="26" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="17" class="freq-title" fill="#38bdf8">SIGNAL PROCESSING &amp; MULTIMEDIA // REAL-TIME EQUALIZER SPECTRUM</text>
  <text x="876" y="17" class="freq-title" fill="#64748b" text-anchor="end">48.0 kHz // 24-BIT STEREO</text>

  <!-- Equalizer Bars Group (36 bars centered, base at y=96) -->
  <g transform="translate(48, 96)">
    <!-- 36 vertical bars -->
    <rect x="0" y="0" width="14" height="22" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="22" y="0" width="14" height="35" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="44" y="0" width="14" height="48" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="66" y="0" width="14" height="18" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="88" y="0" width="14" height="42" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="110" y="0" width="14" height="30" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="132" y="0" width="14" height="50" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="154" y="0" width="14" height="26" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="176" y="0" width="14" height="40" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="198" y="0" width="14" height="32" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="220" y="0" width="14" height="52" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="242" y="0" width="14" height="20" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="264" y="0" width="14" height="44" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="286" y="0" width="14" height="38" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="308" y="0" width="14" height="48" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="330" y="0" width="14" height="24" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="352" y="0" width="14" height="54" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="374" y="0" width="14" height="34" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="396" y="0" width="14" height="46" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="418" y="0" width="14" height="22" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="440" y="0" width="14" height="50" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="462" y="0" width="14" height="36" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="484" y="0" width="14" height="42" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="506" y="0" width="14" height="28" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="528" y="0" width="14" height="52" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="550" y="0" width="14" height="18" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="572" y="0" width="14" height="44" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="594" y="0" width="14" height="32" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="616" y="0" width="14" height="48" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="638" y="0" width="14" height="26" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="660" y="0" width="14" height="40" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="682" y="0" width="14" height="30" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
    <rect x="704" y="0" width="14" height="50" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b5" />
    <rect x="726" y="0" width="14" height="22" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b3" />
    <rect x="748" y="0" width="14" height="42" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b2" />
    <rect x="770" y="0" width="14" height="34" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b4" />
    <rect x="792" y="0" width="14" height="46" rx="2" fill="url(#barGrad)" transform="scale(1, -1)" class="b1" />
  </g>
</svg>
