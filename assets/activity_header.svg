<svg width="900" height="36" viewBox="0 0 900 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0c1628" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="hAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .live { animation: pulse 1.6s infinite ease-in-out; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="900" height="36" rx="7" fill="url(#hBg)" stroke="#1e293b" stroke-width="0.8" />
  <line x1="0" y1="35" x2="900" y2="35" stroke="url(#hAccent)" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="18" cy="18" r="3.5" fill="#ef4444" />
  <circle cx="32" cy="18" r="3.5" fill="#f59e0b" />
  <circle cx="46" cy="18" r="3.5" fill="#10b981" />

  <text x="64" y="22" class="mono" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1.2">GITHUB_TELEMETRY // LIVE DAILY STREAK &amp; COMMIT STREAM</text>

  <circle cx="858" cy="18" r="3" fill="#10b981" class="live" />
  <text x="846" y="22" class="mono" font-size="8.5" fill="#10b981" text-anchor="end" font-weight="600">SYNCED</text>
</svg>
