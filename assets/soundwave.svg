<svg width="450" height="54" viewBox="0 0 450 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    @keyframes bar1 { 0%, 100% { height: 8px; y: 34px; } 50% { height: 26px; y: 16px; } }
    @keyframes bar2 { 0%, 100% { height: 18px; y: 24px; } 50% { height: 32px; y: 10px; } }
    @keyframes bar3 { 0%, 100% { height: 28px; y: 14px; } 50% { height: 12px; y: 30px; } }
    @keyframes bar4 { 0%, 100% { height: 14px; y: 28px; } 50% { height: 36px; y: 6px; } }
    @keyframes bar5 { 0%, 100% { height: 24px; y: 18px; } 50% { height: 16px; y: 26px; } }
    @keyframes bar6 { 0%, 100% { height: 32px; y: 10px; } 50% { height: 8px; y: 34px; } }
    @keyframes bar7 { 0%, 100% { height: 10px; y: 32px; } 50% { height: 30px; y: 12px; } }
    @keyframes bar8 { 0%, 100% { height: 22px; y: 20px; } 50% { height: 14px; y: 28px; } }
    
    .b1 { animation: bar1 1.2s infinite ease-in-out; }
    .b2 { animation: bar2 0.9s infinite ease-in-out 0.2s; }
    .b3 { animation: bar3 1.4s infinite ease-in-out 0.1s; }
    .b4 { animation: bar4 0.8s infinite ease-in-out 0.3s; }
    .b5 { animation: bar5 1.1s infinite ease-in-out 0.15s; }
    .b6 { animation: bar6 1.3s infinite ease-in-out 0.25s; }
    .b7 { animation: bar7 0.95s infinite ease-in-out 0.05s; }
    .b8 { animation: bar8 1.15s infinite ease-in-out 0.35s; }
    
    .text-mono {
      font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #8b949e;
    }
  </style>

  <!-- Background container -->
  <rect x="1" y="1" width="448" height="52" rx="6" fill="url(#boxBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Equalizer Bars -->
  <g transform="translate(18, 0)">
    <rect x="0"  y="34" width="4" height="8"  rx="2" fill="url(#eqGrad)" class="b1" />
    <rect x="8"  y="24" width="4" height="18" rx="2" fill="url(#eqGrad)" class="b2" />
    <rect x="16" y="14" width="4" height="28" rx="2" fill="url(#eqGrad)" class="b3" />
    <rect x="24" y="28" width="4" height="14" rx="2" fill="url(#eqGrad)" class="b4" />
    <rect x="32" y="18" width="4" height="24" rx="2" fill="url(#eqGrad)" class="b5" />
    <rect x="40" y="10" width="4" height="32" rx="2" fill="url(#eqGrad)" class="b6" />
    <rect x="48" y="32" width="4" height="10" rx="2" fill="url(#eqGrad)" class="b7" />
    <rect x="56" y="20" width="4" height="22" rx="2" fill="url(#eqGrad)" class="b8" />
  </g>

  <!-- Label and status text -->
  <text x="96" y="23" class="text-mono" font-weight="700" fill="#00f5d4">FLOW STATE :: LO-FI NEURAL SYNTH</text>
  <text x="96" y="38" class="text-mono">FREQUENCY: <tspan fill="#ff007f">432Hz</tspan> // DEEP FOCUS ENGINE</text>
</svg>
