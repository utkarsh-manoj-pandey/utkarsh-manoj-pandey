<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient matching GitHub #0d1117 -->
    <linearGradient id="spaceDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Sun Glow Corona -->
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Center Cosmic Light -->
    <radialGradient id="cosmicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#070c16" stop-opacity="0.94" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="titleSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px #f59e0b); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 20px #ea580c); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.2; }
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .sun-core {
      transform-origin: 450px 135px;
      animation: sunPulse 4s infinite ease-in-out;
    }
    .orbit-1 { transform-origin: 450px 135px; animation: orbitSpin 5s linear infinite; }
    .orbit-2 { transform-origin: 450px 135px; animation: orbitSpin 9s linear infinite; }
    .orbit-3 { transform-origin: 450px 135px; animation: orbitSpin 14s linear infinite; }
    .orbit-4 { transform-origin: 450px 135px; animation: orbitSpin 20s linear infinite; }
    .orbit-5 { transform-origin: 450px 135px; animation: orbitSpin 30s linear infinite; }
    .orbit-6 { transform-origin: 450px 135px; animation: orbitSpin 44s linear infinite; }
    .orbit-7 { transform-origin: 450px 135px; animation: orbitSpin 60s linear infinite; }

    .twinkle-1 { animation: starTwinkle 3s infinite ease-in-out; }
    .twinkle-2 { animation: starTwinkle 4.5s infinite ease-in-out 1s; }
    .twinkle-3 { animation: starTwinkle 2.5s infinite ease-in-out 0.5s; }
    .live-beacon { animation: beaconPulse 1.8s infinite ease-in-out; }

    .font-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Deep Space Canvas -->
  <rect x="1" y="1" width="898" height="268" rx="10" fill="url(#spaceDarkBg)" stroke="#1a2538" stroke-width="1.2" />
  <circle cx="450" cy="135" r="260" fill="url(#cosmicGlow)" />

  <!-- Twinkling Background Stars -->
  <circle cx="65" cy="48" r="1" fill="#ffffff" class="twinkle-1" />
  <circle cx="120" cy="95" r="0.8" fill="#38bdf8" class="twinkle-2" />
  <circle cx="180" cy="40" r="1.2" fill="#ffffff" class="twinkle-3" />
  <circle cx="230" cy="80" r="0.7" fill="#818cf8" class="twinkle-1" />
  <circle cx="85" cy="190" r="1" fill="#ffffff" class="twinkle-2" />
  <circle cx="140" cy="225" r="0.9" fill="#ffffff" class="twinkle-3" />
  <circle cx="210" cy="240" r="1.1" fill="#38bdf8" class="twinkle-1" />
  <circle cx="290" cy="210" r="0.8" fill="#ffffff" class="twinkle-2" />
  
  <circle cx="840" cy="50" r="1" fill="#ffffff" class="twinkle-1" />
  <circle cx="780" cy="90" r="1.2" fill="#38bdf8" class="twinkle-3" />
  <circle cx="720" cy="45" r="0.8" fill="#ffffff" class="twinkle-2" />
  <circle cx="670" cy="75" r="1" fill="#818cf8" class="twinkle-1" />
  <circle cx="820" cy="195" r="1.1" fill="#ffffff" class="twinkle-3" />
  <circle cx="760" cy="230" r="0.9" fill="#ffffff" class="twinkle-1" />
  <circle cx="690" cy="245" r="0.7" fill="#38bdf8" class="twinkle-2" />
  <circle cx="620" cy="215" r="1" fill="#ffffff" class="twinkle-3" />

  <!-- ===================================================================== -->
  <!-- LIVE SOLAR SYSTEM BACKGROUND: ORBITS & CELESTIAL BODIES               -->
  <!-- ===================================================================== -->

  <!-- Orbit Tracks (Concentric Hairline Rings) -->
  <circle cx="450" cy="135" r="42" stroke="#162235" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="135" r="72" stroke="#162235" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="135" r="110" stroke="#162235" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="135" r="152" stroke="#162235" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="135" r="205" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 4" fill="none" />
  <circle cx="450" cy="135" r="270" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 5" fill="none" />
  <circle cx="450" cy="135" r="350" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 6" fill="none" />

  <!-- Orbit 1: Mercury -->
  <g class="orbit-1">
    <circle cx="492" cy="135" r="2.2" fill="#cbd5e1" />
  </g>

  <!-- Orbit 2: Venus -->
  <g class="orbit-2">
    <circle cx="522" cy="135" r="3.2" fill="#fde68a" />
  </g>

  <!-- Orbit 3: Earth & Moon -->
  <g class="orbit-3">
    <circle cx="560" cy="135" r="4.2" fill="#38bdf8" />
    <circle cx="566" cy="133" r="1.2" fill="#f1f5f9" />
  </g>

  <!-- Orbit 4: Mars -->
  <g class="orbit-4">
    <circle cx="602" cy="135" r="3" fill="#ef4444" />
  </g>

  <!-- Orbit 5: Jupiter -->
  <g class="orbit-5">
    <circle cx="655" cy="135" r="7" fill="#f59e0b" />
    <ellipse cx="655" cy="135" rx="7" ry="2" fill="#b45309" opacity="0.6" />
  </g>

  <!-- Orbit 6: Saturn & Rings -->
  <g class="orbit-6">
    <circle cx="720" cy="135" r="5.5" fill="#fef08a" />
    <ellipse cx="720" cy="135" rx="10" ry="3.5" fill="none" stroke="#fde047" stroke-width="1.2" transform="rotate(-18 720 135)" opacity="0.85" />
  </g>

  <!-- Orbit 7: Uranus / Neptune -->
  <g class="orbit-7">
    <circle cx="800" cy="135" r="4.2" fill="#67e8f9" />
  </g>

  <!-- Glowing Sun Core in the Center -->
  <circle cx="450" cy="135" r="18" fill="url(#sunCorona)" class="sun-core" />

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="898" height="32" rx="10" fill="#080c14" fill-opacity="0.9" />
  <line x1="1" y1="32" x2="899" y2="32" stroke="#1a2538" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="16" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="4.5" fill="#10b981" />

  <text x="80" y="20" class="font-code" font-size="10" fill="#64748b">utkarsh-manoj-pandey // solar-system-runtime</text>

  <!-- Live Status Beacon -->
  <circle cx="848" cy="16" r="3.5" fill="#10b981" class="live-beacon" />
  <text x="836" y="20" class="font-code" font-size="9.5" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1">LIVE SOLAR SYSTEM BG</text>

  <!-- ===================================================================== -->
  <!-- FOREGROUND GLASSMORPHIC IDENTITY CARD                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(160, 68)">
    <!-- Frosted Glass Backing -->
    <rect x="0" y="0" width="580" height="152" rx="12" fill="url(#glassPlate)" stroke="url(#glassBorder)" stroke-width="1.2" />

    <!-- Discipline Pill -->
    <rect x="90" y="14" width="400" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="290" y="29" class="font-code" font-size="9" fill="#38bdf8" font-weight="700" letter-spacing="1.5" text-anchor="middle">SYSTEMS ARCHITECT • SILICON MICROARCHITECTURE</text>

    <!-- Main Title -->
    <text x="290" y="74" class="font-display" font-size="32" font-weight="800" fill="url(#titleSilver)" letter-spacing="-0.5" text-anchor="middle">UTKARSH MANOJ PANDEY</text>

    <!-- Subtitle -->
    <text x="290" y="100" class="font-code" font-size="10.5" fill="#94a3b8" letter-spacing="0.4" text-anchor="middle">Engineering zero-compromise systems from 32-bit RISC-V silicon to low-latency runtimes.</text>

    <!-- Bottom Highlights -->
    <line x1="20" y1="116" x2="560" y2="116" stroke="#162235" stroke-width="1" />
    <text x="290" y="134" class="font-code" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="1">
      <tspan fill="#34d399">PYTHON</tspan> • <tspan fill="#38bdf8">RUST</tspan> • <tspan fill="#60a5fa">C++20</tspan> • <tspan fill="#f59e0b">VHDL &amp; RISC-V</tspan> • <tspan fill="#cbd5e1">LINUX POSIX</tspan>
    </text>
  </g>
</svg>
