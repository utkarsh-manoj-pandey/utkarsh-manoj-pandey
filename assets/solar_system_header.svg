<svg width="900" height="400" viewBox="0 0 900 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient matching GitHub #0d1117 -->
    <linearGradient id="spaceDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Glowing Sun Corona Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Solar Ambient Atmosphere -->
    <radialGradient id="solarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="silverType" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Fine Starfield Pattern -->
    <pattern id="deepStarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.4" fill="#334155" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes starPulse1 { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes starPulse2 { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
    @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .tw-1 { animation: starPulse1 3s infinite ease-in-out; }
    .tw-2 { animation: starPulse2 4s infinite ease-in-out 1s; }
    .beacon-active { animation: beaconBlink 1.8s infinite ease-in-out; }
    .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Deep Space Canvas -->
  <rect x="1" y="1" width="898" height="398" rx="10" fill="url(#spaceDarkBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="396" rx="9" fill="url(#deepStarGrid)" />

  <!-- Solar Ambient Aura (Centered at Sun: 450, 255) -->
  <circle cx="450" cy="255" r="280" fill="url(#solarAura)" />

  <!-- Twinkling Deep Space Stars -->
  <circle cx="65" cy="65" r="1.1" fill="#ffffff" class="tw-1" />
  <circle cx="140" cy="110" r="0.8" fill="#38bdf8" class="tw-2" />
  <circle cx="210" cy="50" r="1.2" fill="#ffffff" class="tw-1" />
  <circle cx="280" cy="95" r="0.7" fill="#818cf8" class="tw-2" />
  <circle cx="80" cy="220" r="1" fill="#ffffff" class="tw-1" />
  <circle cx="150" cy="330" r="0.9" fill="#ffffff" class="tw-2" />
  <circle cx="230" cy="360" r="1.1" fill="#38bdf8" class="tw-1" />
  <circle cx="840" cy="70" r="1.2" fill="#ffffff" class="tw-1" />
  <circle cx="760" cy="115" r="0.8" fill="#38bdf8" class="tw-2" />
  <circle cx="680" cy="60" r="1.1" fill="#ffffff" class="tw-1" />
  <circle cx="820" cy="340" r="1" fill="#ffffff" class="tw-2" />
  <circle cx="750" cy="365" r="0.8" fill="#818cf8" class="tw-1" />
  <circle cx="670" cy="350" r="1.2" fill="#38bdf8" class="tw-2" />

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="898" height="32" rx="10" fill="#070b13" fill-opacity="0.95" />
  <line x1="1" y1="32" x2="899" y2="32" stroke="#1a2538" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="16" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="4.5" fill="#10b981" />

  <text x="80" y="20" class="font-code" font-size="10" fill="#64748b">utkarsh-manoj-pandey // celestial-systems-lab</text>

  <!-- Live Status Beacon -->
  <circle cx="848" cy="16" r="3.5" fill="#10b981" class="beacon-active" />
  <text x="836" y="20" class="font-code" font-size="9.5" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1">LIVE SOLAR SYSTEM BG</text>

  <!-- ===================================================================== -->
  <!-- HERO IDENTITY HEADER (Top area, leaves Solar System visible below)    -->
  <!-- ===================================================================== -->
  <g transform="translate(450, 72)" text-anchor="middle">
    <!-- Domain Tag Pill -->
    <rect x="-195" y="-18" width="390" height="22" rx="11" fill="#0b111e" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-3" class="font-code" font-size="9" fill="#38bdf8" font-weight="700" letter-spacing="1.5">SYSTEMS ARCHITECT • SILICON MICROARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="34" class="font-display" font-size="32" font-weight="800" fill="url(#silverType)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Mission Subtitle -->
    <text x="0" y="56" class="font-code" font-size="10.5" fill="#94a3b8" letter-spacing="0.4">Engineering zero-compromise systems from 32-bit RISC-V silicon to low-latency runtimes.</text>
  </g>

  <!-- ===================================================================== -->
  <!-- LIVE ORBITING SOLAR SYSTEM (Centered at x=450, y=255)                 -->
  <!-- ===================================================================== -->

  <!-- Concentric Orbital Paths (Hairline Dashed Rings) -->
  <circle cx="450" cy="255" r="36" stroke="#172336" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="255" r="62" stroke="#172336" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="255" r="94" stroke="#172336" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="255" r="132" stroke="#172336" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="255" r="176" stroke="#172336" stroke-width="0.6" stroke-dasharray="1 4" fill="none" /> <!-- Asteroid Belt -->
  <circle cx="450" cy="255" r="230" stroke="#172336" stroke-width="0.8" stroke-dasharray="4 4" fill="none" />
  <circle cx="450" cy="255" r="295" stroke="#172336" stroke-width="0.8" stroke-dasharray="4 5" fill="none" />
  <circle cx="450" cy="255" r="365" stroke="#172336" stroke-width="0.8" stroke-dasharray="4 6" fill="none" />

  <!-- 1. Mercury (Period: 4s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 255" to="360 450 255" dur="4s" repeatCount="indefinite" />
    <circle cx="486" cy="255" r="2.2" fill="#cbd5e1" />
  </g>

  <!-- 2. Venus (Period: 7s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="40 450 255" to="400 450 255" dur="7s" repeatCount="indefinite" />
    <circle cx="512" cy="255" r="3.2" fill="#fde68a" />
  </g>

  <!-- 3. Earth & Moon (Period: 11s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 450 255" to="540 450 255" dur="11s" repeatCount="indefinite" />
    <circle cx="544" cy="255" r="4.2" fill="#38bdf8" />
    <!-- Orbiting Moon around Earth -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 544 255" to="360 544 255" dur="2s" repeatCount="indefinite" />
      <circle cx="552" cy="255" r="1.2" fill="#f8fafc" />
    </g>
  </g>

  <!-- 4. Mars (Period: 16s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="90 450 255" to="450 450 255" dur="16s" repeatCount="indefinite" />
    <circle cx="582" cy="255" r="3" fill="#ef4444" />
  </g>

  <!-- 5. Asteroid Dust Particles in Belt -->
  <circle cx="626" cy="255" r="0.7" fill="#64748b" opacity="0.6" />
  <circle cx="274" cy="255" r="0.7" fill="#64748b" opacity="0.6" />
  <circle cx="450" cy="79" r="0.7" fill="#64748b" opacity="0.6" />
  <circle cx="450" cy="431" r="0.7" fill="#64748b" opacity="0.6" />

  <!-- 6. Jupiter & Great Red Spot (Period: 28s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 450 255" to="630 450 255" dur="28s" repeatCount="indefinite" />
    <circle cx="680" cy="255" r="7.5" fill="#f59e0b" />
    <ellipse cx="680" cy="255" rx="7.5" ry="2.2" fill="#b45309" opacity="0.7" />
    <circle cx="683" cy="256" r="1.4" fill="#ef4444" />
  </g>

  <!-- 7. Saturn & Ring System (Period: 42s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="310 450 255" to="670 450 255" dur="42s" repeatCount="indefinite" />
    <ellipse cx="745" cy="255" rx="12" ry="4" fill="none" stroke="#fde047" stroke-width="1.6" transform="rotate(-20 745 255)" opacity="0.9" />
    <circle cx="745" cy="255" r="5.8" fill="#fef08a" />
  </g>

  <!-- 8. Uranus / Neptune (Period: 60s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 450 255" to="480 450 255" dur="60s" repeatCount="indefinite" />
    <circle cx="815" cy="255" r="4.2" fill="#67e8f9" />
  </g>

  <!-- Central Glowing Sun -->
  <circle cx="450" cy="255" r="18" fill="url(#sunGlow)" />
  <circle cx="450" cy="255" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Bottom Telemetry Strip inside SVG -->
  <line x1="20" y1="368" x2="880" y2="368" stroke="#162235" stroke-width="1" />
  <text x="24" y="386" class="font-code" font-size="9" fill="#64748b">ORBITAL TELEMETRY // KEPLER_SOLAR_V3.0</text>
  <text x="450" y="386" class="font-code" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    <tspan fill="#34d399">PYTHON</tspan> • <tspan fill="#38bdf8">RUST</tspan> • <tspan fill="#60a5fa">C++20</tspan> • <tspan fill="#f59e0b">VHDL &amp; RISC-V</tspan>
  </text>
  <text x="876" y="386" class="font-code" font-size="9" fill="#38bdf8" text-anchor="end">5 FLAGSHIP REPOSITORIES</text>
</svg>
