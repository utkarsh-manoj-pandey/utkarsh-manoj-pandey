<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Background Gradient -->
    <linearGradient id="mainCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="40%" stop-color="#070b13" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Outer Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Inner Glass Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0.95" />
    </linearGradient>

    <!-- Card Header Strip Gradient -->
    <linearGradient id="hdrStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10192a" />
      <stop offset="100%" stop-color="#0c1320" />
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="centerAura" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Loss Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Fine Grid Pattern -->
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#152136" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.35; transform: scale(0.85); filter: none; }
    }
    @keyframes scanAcross {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(950px); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 400; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    .pulse-dot {
      transform-origin: 846px 21px;
      animation: pulseLive 2.2s infinite ease-in-out;
    }
    .scanner-line {
      animation: scanAcross 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .wave-anim {
      stroke-dasharray: 400;
      animation: waveMotion 6s linear infinite;
    }
    .f-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .f-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Master Canvas Background -->
  <rect x="1" y="1" width="898" height="518" rx="14" fill="url(#mainCanvas)" stroke="url(#rimStroke)" stroke-width="1.3" />
  <rect x="2" y="2" width="896" height="516" rx="13" fill="url(#dotPattern)" />
  <circle cx="450" cy="180" r="350" fill="url(#centerAura)" />

  <!-- Window Chrome Top Bar -->
  <rect x="1" y="1" width="898" height="42" rx="14" fill="#080c14" fill-opacity="0.95" />
  <line x1="1" y1="42" x2="899" y2="42" stroke="#172236" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <!-- Terminal Title Breadcrumb -->
  <text x="88" y="25" class="f-mono" font-size="11" fill="#64748b" letter-spacing="1">PROMETHEUS-OS v6.12 // HARDWARE TELEMETRY DECK</text>

  <!-- Live Status Beacon -->
  <circle cx="846" cy="21" r="4" fill="#10b981" class="pulse-dot" />
  <text x="834" y="25" class="f-mono" font-size="10.5" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.5">ONLINE // OPTIMAL</text>

  <!-- Laser Scanline -->
  <g clip-path="url(#scanClip)">
    <clipPath id="scanClip">
      <rect x="1" y="42" width="898" height="2" />
    </clipPath>
    <rect x="0" y="42" width="280" height="2" fill="#38bdf8" opacity="0.85" class="scanner-line" />
  </g>

  <!-- ===================================================================== -->
  <!-- HERO IDENTITY HEADER (Height ~95px)                                   -->
  <!-- ===================================================================== -->
  <g transform="translate(32, 60)">
    <!-- Role Capsule -->
    <rect x="0" y="0" width="340" height="24" rx="12" fill="#0c1424" stroke="#1e2c44" stroke-width="1" />
    <text x="14" y="16" class="f-mono" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1.5">AI &amp; INTELLIGENT SYSTEMS DEVELOPER</text>

    <!-- Main Title -->
    <text x="0" y="56" class="f-sans" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>
    
    <!-- Subtitle Spec -->
    <text x="0" y="78" class="f-mono" font-size="11" fill="#94a3b8" letter-spacing="0.8">Raspberry Pi 5 Edge AI • Custom Linux OS Kernel • Fine-Tuning LLMs (Llama 3.3 / DeepSeek R1) • RISC-V</text>

    <!-- Top Right Spec Pill -->
    <g transform="translate(560, 4)">
      <rect x="0" y="0" width="276" height="66" rx="8" fill="#070c16" stroke="#162238" stroke-width="1" />
      <text x="14" y="20" class="f-mono" font-size="9" fill="#64748b" letter-spacing="1">PRIMARY RUNTIME RIG</text>
      <text x="14" y="38" class="f-sans" font-size="12" font-weight="700" fill="#e2e8f0">RPi 5 (ARM64) + M.2 NVMe</text>
      <text x="14" y="54" class="f-mono" font-size="9.5" fill="#34d399">Arch Linux • C/C++ • Rust • Python</text>
    </g>
  </g>

  <line x1="32" y1="156" x2="868" y2="156" stroke="#141d2e" stroke-width="1" />

  <!-- ===================================================================== -->
  <!-- 4-QUADRANT BENTO GRID (Center Layout)                                 -->
  <!-- ===================================================================== -->

  <!-- CARD 1: SIFRA EDGE AI ASSISTANT -->
  <g transform="translate(32, 172)">
    <rect x="0" y="0" width="406" height="150" rx="10" fill="url(#glassCard)" stroke="#1a283e" stroke-width="1.2" />
    <rect x="0" y="0" width="406" height="30" rx="10" fill="url(#hdrStrip)" />
    <line x1="0" y1="30" x2="406" y2="30" stroke="#1a283e" stroke-width="0.8" />
    <text x="14" y="20" class="f-mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">01 // SIFRA AUTONOMOUS VOICE ASSISTANT</text>

    <text x="14" y="52" class="f-sans" font-size="13" font-weight="700" fill="#f8fafc">Fine-Tuned Llama 3.3 &amp; DeepSeek R1</text>
    <text x="14" y="70" class="f-mono" font-size="10" fill="#94a3b8">Hosted on RPi 5 with M.2 NVMe PCIe storage</text>

    <text x="14" y="96" class="f-sans" font-size="12" font-weight="600" fill="#cbd5e1">Multimodal Biometrics &amp; Automation</text>
    <text x="14" y="112" class="f-mono" font-size="9.5" fill="#64748b">Facial Recognition (OpenCV) + Voiceprint Auth</text>
    <text x="14" y="130" class="f-mono" font-size="9.5" fill="#38bdf8">Continuous ASR + Playwright / Selenium Web Control</text>
  </g>

  <!-- CARD 2: PROMETHEUS OPERATING SYSTEM -->
  <g transform="translate(462, 172)">
    <rect x="0" y="0" width="406" height="150" rx="10" fill="url(#glassCard)" stroke="#1a283e" stroke-width="1.2" />
    <rect x="0" y="0" width="406" height="30" rx="10" fill="url(#hdrStrip)" />
    <line x1="0" y1="30" x2="406" y2="30" stroke="#1a283e" stroke-width="0.8" />
    <text x="14" y="20" class="f-mono" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1.2">02 // PROMETHEUS OPERATING SYSTEM</text>

    <text x="14" y="52" class="f-sans" font-size="13" font-weight="700" fill="#f8fafc">Custom Arch Linux Distribution</text>
    <text x="14" y="70" class="f-mono" font-size="10" fill="#94a3b8">Engineered for ARM64 (RPi 5) and x86_64 machines</text>

    <text x="14" y="96" class="f-sans" font-size="12" font-weight="600" fill="#cbd5e1">Kernel Tuning &amp; Microarchitecture</text>
    <text x="14" y="112" class="f-mono" font-size="9.5" fill="#64748b">External M.2 NVMe SSD boot pipeline &amp; shell scripts</text>
    <text x="14" y="130" class="f-mono" font-size="9.5" fill="#818cf8">RISC-V Fundamentals: ISA, Pipelines &amp; Microarchitecture</text>
  </g>

  <!-- CARD 3: POLYGLOT SYSTEMS MATRIX -->
  <g transform="translate(32, 338)">
    <rect x="0" y="0" width="406" height="150" rx="10" fill="url(#glassCard)" stroke="#1a283e" stroke-width="1.2" />
    <rect x="0" y="0" width="406" height="30" rx="10" fill="url(#hdrStrip)" />
    <line x1="0" y1="30" x2="406" y2="30" stroke="#1a283e" stroke-width="0.8" />
    <text x="14" y="20" class="f-mono" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1.2">03 // POLYGLOT SYSTEMS &amp; LANGUAGES</text>

    <text x="14" y="52" class="f-sans" font-size="13" font-weight="700" fill="#f8fafc">Systems: C • C++ • Rust • Go • Pro*C</text>
    <text x="14" y="70" class="f-mono" font-size="10" fill="#94a3b8">Shell: Bash / Shell Script • PowerShell</text>

    <text x="14" y="96" class="f-sans" font-size="12" font-weight="600" fill="#cbd5e1">AI &amp; Science: Python • Julia • R • Scala • Java</text>
    <text x="14" y="112" class="f-mono" font-size="9.5" fill="#64748b">Stores: SQLite (Audio-Visual) • PostgreSQL • OracleDB</text>
    <text x="14" y="130" class="f-mono" font-size="9.5" fill="#34d399">Desktop &amp; Apps: PyQt GUI • Linux (Manjaro, Oracle, Arch)</text>
  </g>

  <!-- CARD 4: LIVE MODEL TELEMETRY & CONVERGENCE -->
  <g transform="translate(462, 338)">
    <rect x="0" y="0" width="406" height="150" rx="10" fill="url(#glassCard)" stroke="#1a283e" stroke-width="1.2" />
    <rect x="0" y="0" width="406" height="30" rx="10" fill="url(#hdrStrip)" />
    <line x1="0" y1="30" x2="406" y2="30" stroke="#1a283e" stroke-width="0.8" />
    <text x="14" y="20" class="f-mono" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1.2">04 // NEURAL PIPELINE TELEMETRY</text>

    <text x="14" y="52" class="f-sans" font-size="12.5" font-weight="700" fill="#f8fafc">Fine-Tuning Convergence Wave</text>
    <text x="392" y="52" class="f-mono" font-size="9.5" fill="#34d399" text-anchor="end">LOSS: 0.0012</text>

    <!-- Sparkline Frame -->
    <rect x="14" y="62" width="378" height="54" rx="6" fill="#060a12" stroke="#131e30" stroke-width="0.8" />
    <line x1="14" y1="89" x2="392" y2="89" stroke="#0e1726" stroke-width="0.8" stroke-dasharray="3 3" />
    
    <!-- Animated Loss Waveform -->
    <path d="M 24 104 Q 80 96, 120 78 T 220 72 T 320 68 T 382 66" fill="none" stroke="url(#waveGrad)" stroke-width="2.2" class="wave-anim" />
    <circle cx="382" cy="66" r="3.5" fill="#34d399" />

    <text x="14" y="132" class="f-mono" font-size="9" fill="#64748b">ACCREDITATION: ISRO (GIS) • IIT MADRAS (DATA SCIENCE) • AWS • GOOGLE</text>
  </g>
</svg>
