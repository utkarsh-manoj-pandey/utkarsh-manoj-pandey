<svg width="900" height="74" viewBox="0 0 900 74" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="barAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes sweepGlow {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulseLiveDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .beam-anim {
      animation: sweepGlow 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-dot {
      animation: pulseLiveDot 1.8s infinite ease-in-out;
    }
    .tech-mono {
      font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      fill: #64748b;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="72" rx="6" fill="url(#loadBg)" stroke="#1e293b" stroke-width="1" />

  <!-- Top Metadata Line -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="3" fill="#10b981" class="pulse-dot" />
    <text x="12" y="3" class="tech-mono">SYSTEM_RUNTIME :: <tspan fill="#f1f5f9" font-weight="600">STABLE</tspan></text>
    <text x="360" y="3" class="tech-mono">NEURAL_KERNEL: <tspan fill="#38bdf8">x86_64 // PRODUCTION</tspan></text>
    <text x="852" y="3" class="tech-mono" text-anchor="end">INITIALIZATION: <tspan fill="#38bdf8" font-weight="700">100.0%</tspan></text>
  </g>

  <!-- Progress Bar Track -->
  <rect x="24" y="34" width="852" height="8" rx="2" fill="#0d1424" stroke="#1a2335" stroke-width="0.8" />

  <!-- Active Bar with Animated Laser Sweep -->
  <g clip-path="url(#barClip)">
    <clipPath id="barClip">
      <rect x="24" y="34" width="852" height="8" rx="2" />
    </clipPath>
    <rect x="24" y="34" width="852" height="8" fill="url(#barAccent)" opacity="0.85" />
    <rect x="0" y="34" width="120" height="8" fill="url(#scanBeam)" class="beam-anim" />
  </g>

  <!-- Bottom Sub-Telemetry -->
  <g transform="translate(24, 58)">
    <text x="0" y="0" class="tech-mono">COMPUTE: <tspan fill="#94a3b8">DISTRIBUTED</tspan></text>
    <text x="220" y="0" class="tech-mono">DATA LATENCY: <tspan fill="#34d399">0.02ms</tspan></text>
    <text x="460" y="0" class="tech-mono">INFERENCE PIPELINE: <tspan fill="#94a3b8">OPTIMIZED</tspan></text>
    <text x="852" y="0" class="tech-mono" text-anchor="end" fill="#64748b">MISSION: CONTINUOUS EVOLUTION</text>
  </g>
</svg>
