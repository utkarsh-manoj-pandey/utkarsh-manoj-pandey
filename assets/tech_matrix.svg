<svg width="900" height="170" viewBox="0 0 900 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
  </defs>

  <style>
    .mono-hdr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #f1f5f9;
    }
    .text-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
  </style>

  <!-- Bento Card 1: Machine Learning & Intelligence -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="276" height="150" rx="8" fill="url(#cardGrad)" stroke="#1a2333" stroke-width="1" />
    <rect x="0" y="0" width="276" height="30" rx="8" fill="#0d131f" />
    <line x1="0" y1="30" x2="276" y2="30" stroke="#1a2333" stroke-width="0.8" />
    <text x="14" y="20" class="mono-hdr">01 // AI &amp; MACHINE LEARNING</text>

    <text x="14" y="54" class="text-title">PyTorch • TensorFlow • Scikit-Learn</text>
    <text x="14" y="70" class="text-sub">Deep Neural Networks &amp; Classifiers</text>

    <text x="14" y="98" class="text-title">NLP &amp; Recurrent Nets (LSTM)</text>
    <text x="14" y="114" class="text-sub">Sentiment Mining • Sequence Modeling</text>

    <text x="14" y="136" class="text-sub" fill="#64748b">Vectorized: Pandas • NumPy • SciPy</text>
  </g>

  <!-- Bento Card 2: Backend & Data Engineering -->
  <g transform="translate(312, 10)">
    <rect x="0" y="0" width="276" height="150" rx="8" fill="url(#cardGrad)" stroke="#1a2333" stroke-width="1" />
    <rect x="0" y="0" width="276" height="30" rx="8" fill="#0d131f" />
    <line x1="0" y1="30" x2="276" y2="30" stroke="#1a2333" stroke-width="0.8" />
    <text x="14" y="20" class="mono-hdr" fill="#818cf8">02 // BACKEND &amp; DATA SYSTEMS</text>

    <text x="14" y="54" class="text-title">Python 3.x (Production Grade)</text>
    <text x="14" y="70" class="text-sub">Asynchronous APIs • Microservices</text>

    <text x="14" y="98" class="text-title">FastAPI • Flask • Django</text>
    <text x="14" y="114" class="text-sub">RESTful Endpoints • Low Latency</text>

    <text x="14" y="136" class="text-sub" fill="#64748b">Stores: PostgreSQL • MySQL • MongoDB</text>
  </g>

  <!-- Bento Card 3: Infrastructure & DevOps -->
  <g transform="translate(609, 10)">
    <rect x="0" y="0" width="276" height="150" rx="8" fill="url(#cardGrad)" stroke="#1a2333" stroke-width="1" />
    <rect x="0" y="0" width="276" height="30" rx="8" fill="#0d131f" />
    <line x1="0" y1="30" x2="276" y2="30" stroke="#1a2333" stroke-width="0.8" />
    <text x="14" y="20" class="mono-hdr" fill="#34d399">03 // DEVOPS &amp; ENVIRONMENT</text>

    <text x="14" y="54" class="text-title">Docker Containers &amp; Compose</text>
    <text x="14" y="70" class="text-sub">Production Reproducibility</text>

    <text x="14" y="98" class="text-title">Git • GitHub Actions CI/CD</text>
    <text x="14" y="114" class="text-sub">Automated Test &amp; Deploy Pipelines</text>

    <text x="14" y="136" class="text-sub" fill="#64748b">Linux: Ubuntu/Debian • Unix Shell</text>
  </g>
</svg>
