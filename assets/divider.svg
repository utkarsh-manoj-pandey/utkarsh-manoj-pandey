<svg width="900" height="16" viewBox="0 0 900 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="thinLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090e" stop-opacity="0" />
      <stop offset="25%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .node-pulse {
      transform-origin: 450px 8px;
      animation: pulseCore 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Precision Hairline -->
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#thinLine)" stroke-width="1" />

  <!-- Center Micro Crosshair -->
  <circle cx="450" cy="8" r="2.5" fill="#38bdf8" class="node-pulse" />
  <circle cx="450" cy="8" r="1" fill="#ffffff" />
  <line x1="438" y1="8" x2="444" y2="8" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
  <line x1="456" y1="8" x2="462" y2="8" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
</svg>
