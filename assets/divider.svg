<svg width="850" height="24" viewBox="0 0 850 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff007f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>

    <filter id="dividerGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDiamond {
      0%, 100% { transform: scale(1) rotate(45deg); opacity: 0.9; filter: drop-shadow(0 0 4px #00f5d4); }
      50% { transform: scale(1.3) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 8px #ff007f); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    .center-node {
      transform-origin: 425px 12px;
      animation: pulseDiamond 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Base Line -->
  <line x1="20" y1="12" x2="830" y2="12" stroke="url(#dividerGrad)" stroke-width="1.5" filter="url(#dividerGlow)" />

  <!-- Secondary subtle accent dashes -->
  <line x1="200" y1="12" x2="650" y2="12" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="8 16" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0; 48" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Center Glowing Cyber Diamond -->
  <rect x="420" y="7" width="10" height="10" fill="#00f5d4" class="center-node" />
  <circle cx="425" cy="12" r="2" fill="#ffffff" />
</svg>
