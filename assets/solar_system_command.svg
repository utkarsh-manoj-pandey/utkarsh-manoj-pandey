<svg width="900" height="430" viewBox="0 0 900 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient matching GitHub Dark #0d1117 -->
    <linearGradient id="spaceDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Radiant Glowing Sun Corona -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fffbeb" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Solar Ambient Atmosphere -->
    <radialGradient id="solarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Typography Gradient -->
    <linearGradient id="silverType" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Fine Deep Space Star Grid -->
    <pattern id="deepStarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.4" fill="#334155" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes starPulse1 { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes starPulse2 { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }
    @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .tw-1 { animation: starPulse1 3s infinite ease-in-out; }
    .tw-2 { animation: starPulse2 4.5s infinite ease-in-out 1.2s; }
    .beacon-active { animation: beaconBlink 1.8s infinite ease-in-out; }
    .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Deep Space Canvas Shell -->
  <rect x="1" y="1" width="898" height="428" rx="12" fill="url(#spaceDarkBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="426" rx="11" fill="url(#deepStarGrid)" />

  <!-- Solar Ambient Aura (Centered at Sun: 450, 275) -->
  <circle cx="450" cy="275" r="300" fill="url(#solarAura)" />

  <!-- Twinkling Distant Stars -->
  <circle cx="70" cy="70" r="1.1" fill="#ffffff" class="tw-1" />
  <circle cx="150" cy="115" r="0.8" fill="#38bdf8" class="tw-2" />
  <circle cx="220" cy="55" r="1.2" fill="#ffffff" class="tw-1" />
  <circle cx="310" cy="100" r="0.7" fill="#818cf8" class="tw-2" />
  <circle cx="75" cy="230" r="1" fill="#ffffff" class="tw-1" />
  <circle cx="140" cy="350" r="0.9" fill="#ffffff" class="tw-2" />
  <circle cx="240" cy="385" r="1.1" fill="#38bdf8" class="tw-1" />
  <circle cx="830" cy="75" r="1.2" fill="#ffffff" class="tw-1" />
  <circle cx="750" cy="120" r="0.8" fill="#38bdf8" class="tw-2" />
  <circle cx="670" cy="65" r="1.1" fill="#ffffff" class="tw-1" />
  <circle cx="820" cy="355" r="1" fill="#ffffff" class="tw-2" />
  <circle cx="740" cy="380" r="0.8" fill="#818cf8" class="tw-1" />
  <circle cx="660" cy="365" r="1.2" fill="#38bdf8" class="tw-2" />

  <!-- Top Aerospace Status Header Bar -->
  <rect x="1" y="1" width="898" height="34" rx="12" fill="#070b13" fill-opacity="0.95" />
  <line x1="1" y1="34" x2="899" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Command Dots -->
  <circle cx="22" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="54" cy="17" r="4.5" fill="#10b981" />

  <text x="80" y="21" class="font-code" font-size="10" fill="#64748b">utkarsh-manoj-pandey // celestial-command-deck</text>

  <!-- Live Status Beacon -->
  <circle cx="850" cy="17" r="3.5" fill="#10b981" class="beacon-active" />
  <text x="838" y="21" class="font-code" font-size="9.5" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1">LIVE SOLAR SYSTEM BG</text>

  <!-- ===================================================================== -->
  <!-- HERO IDENTITY HEADER (Top 120px area, leaving Solar System visible)   -->
  <!-- ===================================================================== -->
  <g transform="translate(450, 74)" text-anchor="middle">
    <!-- Domain Tag Pill -->
    <rect x="-205" y="-18" width="410" height="24" rx="12" fill="#0b111e" stroke="#1e293b" stroke-width="1.1" />
    <text x="0" y="-2" class="font-code" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1.5">SYSTEMS ARCHITECT • SILICON MICROARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="36" class="font-display" font-size="33" font-weight="800" fill="url(#silverType)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Mission Subtitle -->
    <text x="0" y="58" class="font-code" font-size="10.5" fill="#94a3b8" letter-spacing="0.4">Designing zero-compromise systems from 32-bit RISC-V silicon to low-latency runtimes.</text>
  </g>

  <!-- ===================================================================== -->
  <!-- LIVE ORBITING SOLAR SYSTEM (Centered at x=450, y=275)                 -->
  <!-- ===================================================================== -->

  <!-- Concentric Keplerian Orbital Trajectories -->
  <circle cx="450" cy="275" r="36" stroke="#162235" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="275" r="62" stroke="#162235" stroke-width="0.8" stroke-dasharray="2 3" fill="none" />
  <circle cx="450" cy="275" r="92" stroke="#162235" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="275" r="128" stroke="#162235" stroke-width="0.8" stroke-dasharray="3 4" fill="none" />
  <circle cx="450" cy="275" r="168" stroke="#162235" stroke-width="0.6" stroke-dasharray="1 5" fill="none" /> <!-- Asteroid Belt -->
  <circle cx="450" cy="275" r="220" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 4" fill="none" />
  <circle cx="450" cy="275" r="280" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 5" fill="none" />
  <circle cx="450" cy="275" r="345" stroke="#162235" stroke-width="0.8" stroke-dasharray="4 6" fill="none" />
  <circle cx="450" cy="275" r="405" stroke="#162235" stroke-width="0.8" stroke-dasharray="5 7" fill="none" />

  <!-- 1. Mercury (Period: 4.5s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 275" to="360 450 275" dur="4.5s" repeatCount="indefinite" />
    <circle cx="486" cy="275" r="2.4" fill="#cbd5e1" />
  </g>

  <!-- 2. Venus (Period: 7.5s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="40 450 275" to="400 450 275" dur="7.5s" repeatCount="indefinite" />
    <circle cx="512" cy="275" r="3.4" fill="#fde68a" />
  </g>

  <!-- 3. Earth & Moon (Period: 11s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 450 275" to="540 450 275" dur="11s" repeatCount="indefinite" />
    <circle cx="542" cy="275" r="4.4" fill="#38bdf8" />
    <!-- Orbiting Moon around Earth -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 542 275" to="360 542 275" dur="2.2s" repeatCount="indefinite" />
      <circle cx="550" cy="275" r="1.3" fill="#f8fafc" />
    </g>
  </g>

  <!-- 4. Mars (Period: 16s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="90 450 275" to="450 450 275" dur="16s" repeatCount="indefinite" />
    <circle cx="578" cy="275" r="3.2" fill="#ef4444" />
  </g>

  <!-- 5. Asteroid Dust Particles in Belt -->
  <circle cx="618" cy="275" r="0.8" fill="#64748b" opacity="0.7" />
  <circle cx="282" cy="275" r="0.8" fill="#64748b" opacity="0.7" />
  <circle cx="450" cy="107" r="0.8" fill="#64748b" opacity="0.7" />
  <circle cx="450" cy="443" r="0.8" fill="#64748b" opacity="0.7" />
  <circle cx="569" cy="156" r="0.7" fill="#64748b" opacity="0.6" />
  <circle cx="331" cy="394" r="0.7" fill="#64748b" opacity="0.6" />

  <!-- 6. Jupiter & Great Red Spot (Period: 26s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 450 275" to="630 450 275" dur="26s" repeatCount="indefinite" />
    <circle cx="670" cy="275" r="8" fill="#f59e0b" />
    <ellipse cx="670" cy="275" rx="8" ry="2.4" fill="#b45309" opacity="0.7" />
    <circle cx="673" cy="276" r="1.6" fill="#ef4444" />
  </g>

  <!-- 7. Saturn & Ring System (Period: 38s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="310 450 275" to="670 450 275" dur="38s" repeatCount="indefinite" />
    <ellipse cx="730" cy="275" rx="13" ry="4.5" fill="none" stroke="#fde047" stroke-width="1.8" transform="rotate(-20 730 275)" opacity="0.9" />
    <circle cx="730" cy="275" r="6" fill="#fef08a" />
  </g>

  <!-- 8. Uranus (Period: 52s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 450 275" to="480 450 275" dur="52s" repeatCount="indefinite" />
    <circle cx="795" cy="275" r="4.5" fill="#67e8f9" />
  </g>

  <!-- 9. Neptune (Period: 70s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="210 450 275" to="570 450 275" dur="70s" repeatCount="indefinite" />
    <circle cx="855" cy="275" r="4.2" fill="#3b82f6" />
  </g>

  <!-- Central Radiant Sun -->
  <circle cx="450" cy="275" r="19" fill="url(#sunGlow)" />
  <circle cx="450" cy="275" r="8.5" fill="#ffffff" opacity="0.95" />

  <!-- Bottom Telemetry Strip inside SVG -->
  <line x1="20" y1="398" x2="880" y2="398" stroke="#162235" stroke-width="1" />
  <text x="24" y="416" class="font-code" font-size="9" fill="#64748b">ORBITAL TELEMETRY // KEPLER_SOLAR_V4.2</text>
  <text x="450" y="416" class="font-code" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    <tspan fill="#34d399">PYTHON 3.11</tspan> • <tspan fill="#38bdf8">RUST</tspan> • <tspan fill="#60a5fa">MODERN C++20</tspan> • <tspan fill="#f59e0b">VHDL &amp; RISC-V</tspan>
  </text>
  <text x="876" y="416" class="font-code" font-size="9" fill="#38bdf8" text-anchor="end">5 FLAGSHIP SYSTEMS</text>
</svg>
