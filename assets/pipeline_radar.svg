<svg width="900" height="175" viewBox="0 0 900 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d16" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="diagGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#121d2e" stroke-width="0.6" />
      <circle cx="8" cy="8" r="0.5" fill="#1b2a40" />
    </pattern>

    <!-- Signal Pulse Animation Gradient -->
    <linearGradient id="busSignal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes busPulseMotion {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(390px); opacity: 0; }
    }
    @keyframes clkPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }
    .pipe-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .sig-dot {
      animation: busPulseMotion 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .clk-active {
      animation: clkPulse 1.2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="173" rx="8" fill="url(#hudBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="171" rx="7" fill="url(#diagGrid)" />

  <!-- Top Title Bar -->
  <rect x="1" y="1" width="898" height="28" rx="8" fill="#0b101a" />
  <line x1="1" y1="28" x2="899" y2="28" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="18" class="pipe-font" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1">HARDWARE PIPELINE SCHEMATIC // 5-STAGE RV32I INSTRUCTION EXECUTION</text>
  <text x="876" y="18" class="pipe-font" font-size="9" fill="#64748b" text-anchor="end" letter-spacing="1">SYSTEMS RADAR</text>

  <!-- Vertical Divider between Schematic and Radar -->
  <line x1="520" y1="36" x2="520" y2="165" stroke="#162235" stroke-width="1" stroke-dasharray="3 3" />

  <!-- ===================================================================== -->
  <!-- LEFT COLUMN: 5-STAGE CPU PIPELINE                                     -->
  <!-- ===================================================================== -->

  <!-- Interconnect Bus Spine Line -->
  <line x1="40" y1="74" x2="496" y2="74" stroke="#1e2c42" stroke-width="2" />
  <circle cx="48" cy="74" r="3" fill="#38bdf8" class="sig-dot" />

  <!-- Stage 1: IF -->
  <g transform="translate(36, 46)">
    <rect x="0" y="0" width="80" height="54" rx="4" fill="#080e18" stroke="#1e2d44" stroke-width="1" />
    <text x="40" y="22" class="pipe-font" font-size="11" fill="#f59e0b" font-weight="800" text-anchor="middle">IF</text>
    <text x="40" y="36" class="pipe-font" font-size="8" fill="#94a3b8" text-anchor="middle">Fetch</text>
    <text x="40" y="47" class="pipe-font" font-size="7" fill="#64748b" text-anchor="middle">PC / ROM</text>
  </g>

  <!-- Stage 2: ID -->
  <g transform="translate(132, 46)">
    <rect x="0" y="0" width="80" height="54" rx="4" fill="#080e18" stroke="#1e2d44" stroke-width="1" />
    <text x="40" y="22" class="pipe-font" font-size="11" fill="#38bdf8" font-weight="800" text-anchor="middle">ID</text>
    <text x="40" y="36" class="pipe-font" font-size="8" fill="#94a3b8" text-anchor="middle">Decode</text>
    <text x="40" y="47" class="pipe-font" font-size="7" fill="#64748b" text-anchor="middle">RegFile</text>
  </g>

  <!-- Stage 3: EX -->
  <g transform="translate(228, 46)">
    <rect x="0" y="0" width="80" height="54" rx="4" fill="#080e18" stroke="#1e2d44" stroke-width="1" />
    <text x="40" y="22" class="pipe-font" font-size="11" fill="#818cf8" font-weight="800" text-anchor="middle">EX</text>
    <text x="40" y="36" class="pipe-font" font-size="8" fill="#94a3b8" text-anchor="middle">Execute</text>
    <text x="40" y="47" class="pipe-font" font-size="7" fill="#64748b" text-anchor="middle">ALU Core</text>
  </g>

  <!-- Stage 4: MEM -->
  <g transform="translate(324, 46)">
    <rect x="0" y="0" width="80" height="54" rx="4" fill="#080e18" stroke="#1e2d44" stroke-width="1" />
    <text x="40" y="22" class="pipe-font" font-size="11" fill="#60a5fa" font-weight="800" text-anchor="middle">MEM</text>
    <text x="40" y="36" class="pipe-font" font-size="8" fill="#94a3b8" text-anchor="middle">Memory</text>
    <text x="40" y="47" class="pipe-font" font-size="7" fill="#64748b" text-anchor="middle">SRAM Data</text>
  </g>

  <!-- Stage 5: WB -->
  <g transform="translate(420, 46)">
    <rect x="0" y="0" width="80" height="54" rx="4" fill="#080e18" stroke="#1e2d44" stroke-width="1" />
    <text x="40" y="22" class="pipe-font" font-size="11" fill="#34d399" font-weight="800" text-anchor="middle">WB</text>
    <text x="40" y="36" class="pipe-font" font-size="8" fill="#94a3b8" text-anchor="middle">WriteBack</text>
    <text x="40" y="47" class="pipe-font" font-size="7" fill="#64748b" text-anchor="middle">Reg Commit</text>
  </g>

  <!-- Clock & Pipeline Telemetry Bar (Bottom of Left Column) -->
  <g transform="translate(36, 116)">
    <text x="0" y="16" class="pipe-font" font-size="9" fill="#64748b">CLK_SIGNAL</text>
    <!-- Square wave pulse -->
    <path d="M 80 14 L 92 14 L 92 4 L 104 4 L 104 14 L 116 14 L 116 4 L 128 4 L 128 14 L 140 14 L 140 4 L 152 4 L 152 14 L 164 14" fill="none" stroke="#10b981" stroke-width="1.5" class="clk-active" />
    <text x="180" y="14" class="pipe-font" font-size="8.5" fill="#38bdf8">SYNCHRONOUS CLOCK // 50 MHz SYNTHESIS TARGET</text>
    <text x="0" y="36" class="pipe-font" font-size="8.5" fill="#94a3b8">HAZARD DETECTION: Data Forwarding • Stall Logic • Branch Prediction Unit</text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT COLUMN: SYSTEMS ENGINEERING RADAR                               -->
  <!-- ===================================================================== -->
  <g transform="translate(544, 40)">
    <!-- Discipline 1: Silicon & RTL -->
    <text x="0" y="12" class="pipe-font" font-size="8.5" fill="#cbd5e1" font-weight="600">SILICON &amp; RTL ARCHITECTURE (VHDL)</text>
    <text x="325" y="12" class="pipe-font" font-size="8.5" fill="#f59e0b" font-weight="700" text-anchor="end">98%</text>
    <rect x="0" y="18" width="325" height="5" rx="2.5" fill="#121824" />
    <rect x="0" y="18" width="318" height="5" rx="2.5" fill="#f59e0b" />

    <!-- Discipline 2: Memory-Safe Systems -->
    <text x="0" y="42" class="pipe-font" font-size="8.5" fill="#cbd5e1" font-weight="600">MEMORY-SAFE SYSTEMS &amp; AGENTS (RUST)</text>
    <text x="325" y="42" class="pipe-font" font-size="8.5" fill="#38bdf8" font-weight="700" text-anchor="end">96%</text>
    <rect x="0" y="48" width="325" height="5" rx="2.5" fill="#121824" />
    <rect x="0" y="48" width="312" height="5" rx="2.5" fill="#38bdf8" />

    <!-- Discipline 3: High-Performance C++ -->
    <text x="0" y="72" class="pipe-font" font-size="8.5" fill="#cbd5e1" font-weight="600">HIGH-THROUGHPUT MEDIA &amp; SIMD (C++)</text>
    <text x="325" y="72" class="pipe-font" font-size="8.5" fill="#818cf8" font-weight="700" text-anchor="end">94%</text>
    <rect x="0" y="78" width="325" height="5" rx="2.5" fill="#121824" />
    <rect x="0" y="78" width="305" height="5" rx="2.5" fill="#818cf8" />

    <!-- Discipline 4: Local-First Privacy -->
    <text x="0" y="102" class="pipe-font" font-size="8.5" fill="#cbd5e1" font-weight="600">LOCAL-FIRST PRIVACY &amp; OFFLINE WORKSPACE</text>
    <text x="325" y="102" class="pipe-font" font-size="8.5" fill="#34d399" font-weight="700" text-anchor="end">100%</text>
    <rect x="0" y="108" width="325" height="5" rx="2.5" fill="#121824" />
    <rect x="0" y="108" width="325" height="5" rx="2.5" fill="#34d399" />
  </g>
</svg>
