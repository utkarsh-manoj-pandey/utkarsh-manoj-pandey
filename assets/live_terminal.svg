<svg width="900" height="210" viewBox="0 0 900 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#162032" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes revealStep1 {
      0%, 8% { opacity: 0; transform: translateY(2px); }
      12%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealStep2 {
      0%, 30% { opacity: 0; transform: translateY(2px); }
      34%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealStep3 {
      0%, 55% { opacity: 0; transform: translateY(2px); }
      60%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealPromptFinal {
      0%, 78% { opacity: 0; }
      82%, 100% { opacity: 1; }
    }
    .term-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 11px;
    }
    .cursor-active {
      animation: cursorBlink 0.8s infinite;
    }
    .step-1 { animation: revealStep1 10s infinite; }
    .step-2 { animation: revealStep2 10s infinite; }
    .step-3 { animation: revealStep3 10s infinite; }
    .step-final { animation: revealPromptFinal 10s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="208" rx="8" fill="url(#termBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="206" rx="7" fill="url(#scanlines)" />

  <!-- Window Titlebar -->
  <rect x="1" y="1" width="898" height="30" rx="8" fill="#0b101a" />
  <line x1="1" y1="30" x2="899" y2="30" stroke="#1a2538" stroke-width="1" />

  <!-- Controls -->
  <circle cx="20" cy="15" r="4.5" fill="#ef4444" />
  <circle cx="35" cy="15" r="4.5" fill="#f59e0b" />
  <circle cx="50" cy="15" r="4.5" fill="#10b981" />

  <text x="80" y="19" class="term-font" font-size="10" fill="#64748b">sys-diagnostics -- zsh 5.9 (x86_64-pc-linux-gnu)</text>
  <text x="876" y="19" class="term-font" font-size="9.5" fill="#38bdf8" text-anchor="end">TERMINAL SESSION // LIVE</text>

  <!-- Command Line 1 -->
  <g transform="translate(24, 52)">
    <text class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#f8fafc" font-weight="600">whoami --verbose</tspan>
    </text>
    <!-- Response 1 -->
    <g class="step-1">
      <text y="18" class="term-font" fill="#94a3b8">
        <tspan fill="#f59e0b">➜</tspan> <tspan fill="#e2e8f0" font-weight="600">Utkarsh Manoj Pandey</tspan> <tspan fill="#64748b">|</tspan> Systems &amp; Silicon Engineer <tspan fill="#64748b">|</tspan> M.Sc. IT (CGPA: 8.7, Grant Winner)
      </text>
    </g>
  </g>

  <!-- Command Line 2 -->
  <g transform="translate(24, 98)" class="step-2">
    <text class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#f8fafc" font-weight="600">cat /etc/engineering_creed</tspan>
    </text>
    <!-- Response 2 -->
    <text y="18" class="term-font" fill="#94a3b8">
      <tspan fill="#38bdf8">➜</tspan> <tspan fill="#38bdf8" font-style="italic">"From RTL silicon synthesis to memory-safe agents: build with zero compromise on privacy and speed."</tspan>
    </text>
  </g>

  <!-- Command Line 3 -->
  <g transform="translate(24, 144)" class="step-3">
    <text class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#f8fafc" font-weight="600">sysctl -a | grep -E "telemetry|arch|safety"</tspan>
    </text>
    <!-- Response 3 -->
    <text y="18" class="term-font">
      <tspan fill="#818cf8">➜</tspan> <tspan fill="#cbd5e1">sec.telemetry = </tspan><tspan fill="#10b981" font-weight="700">0 (DISABLED)</tspan>  <tspan fill="#64748b">│</tspan>  <tspan fill="#cbd5e1">arch.pipeline = </tspan><tspan fill="#f59e0b" font-weight="700">RV32I_5_STAGE</tspan>  <tspan fill="#64748b">│</tspan>  <tspan fill="#cbd5e1">rust.memory_safety = </tspan><tspan fill="#38bdf8" font-weight="700">STRICT</tspan>
    </text>
  </g>

  <!-- Final Active Prompt with Blinking Cursor -->
  <g transform="translate(24, 190)" class="step-final">
    <text class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#38bdf8">exec --clean</tspan>
    </text>
    <rect x="180" y="-10" width="7" height="13" fill="#38bdf8" class="cursor-active" />
  </g>
</svg>
