<svg width="900" height="265" viewBox="0 0 900 265" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#162032" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes lineReveal1 {
      0%, 5% { opacity: 0; }
      8%, 100% { opacity: 1; }
    }
    @keyframes lineReveal2 {
      0%, 25% { opacity: 0; }
      30%, 100% { opacity: 1; }
    }
    @keyframes lineReveal3 {
      0%, 50% { opacity: 0; }
      55%, 100% { opacity: 1; }
    }
    @keyframes lineReveal4 {
      0%, 75% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    .term-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 11.5px;
    }
    .cursor-active {
      animation: cursorBlink 0.9s infinite;
    }
    .anim-line-1 { animation: lineReveal1 12s infinite; }
    .anim-line-2 { animation: lineReveal2 12s infinite; }
    .anim-line-3 { animation: lineReveal3 12s infinite; }
    .anim-line-4 { animation: lineReveal4 12s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="263" rx="8" fill="url(#termBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="261" rx="7" fill="url(#scanlines)" />

  <!-- Window Titlebar -->
  <rect x="1" y="1" width="898" height="32" rx="8" fill="#0b101a" />
  <line x1="1" y1="32" x2="899" y2="32" stroke="#1a2538" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="16" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="4.5" fill="#10b981" />

  <text x="80" y="20" class="term-font" font-size="10" fill="#64748b">sys-diagnostics -- zsh 5.9 (x86_64-pc-linux-gnu)</text>
  <text x="876" y="20" class="term-font" font-size="9.5" fill="#38bdf8" text-anchor="end">LIVE TERMINAL SESSION</text>

  <!-- ===================================================================== -->
  <!-- COMMAND 1 & RESPONSE (Discrete fixed Y coordinates, zero overlap)     -->
  <!-- ===================================================================== -->
  <text x="24" y="60" class="term-font">
    <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
    <tspan fill="#f8fafc" font-weight="600">whoami --verbose</tspan>
  </text>

  <g class="anim-line-1">
    <text x="24" y="86" class="term-font">
      <tspan fill="#f59e0b">➜</tspan> <tspan fill="#e2e8f0" font-weight="600">Utkarsh Manoj Pandey</tspan>
      <tspan fill="#64748b"> │ </tspan><tspan fill="#38bdf8">Systems &amp; Silicon Architect</tspan>
      <tspan fill="#64748b"> │ </tspan><tspan fill="#10b981">M.Sc. IT (CGPA: 8.7, Grant Winner)</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- COMMAND 2 & RESPONSE                                                  -->
  <!-- ===================================================================== -->
  <g class="anim-line-2">
    <text x="24" y="118" class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#f8fafc" font-weight="600">cat /etc/engineering_creed</tspan>
    </text>

    <text x="24" y="144" class="term-font">
      <tspan fill="#38bdf8">➜</tspan> <tspan fill="#cbd5e1" font-style="italic">"Zero telemetry, zero bloat, cycle-accurate silicon &amp; memory-safe runtimes."</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- COMMAND 3 & RESPONSE                                                  -->
  <!-- ===================================================================== -->
  <g class="anim-line-3">
    <text x="24" y="176" class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#f8fafc" font-weight="600">sysctl -q hardware.pipeline security.telemetry compiler.opt</tspan>
    </text>

    <text x="24" y="202" class="term-font">
      <tspan fill="#818cf8">➜</tspan> <tspan fill="#94a3b8">telemetry = </tspan><tspan fill="#10b981" font-weight="700">0 (OFFLINE)</tspan>
      <tspan fill="#64748b"> │ </tspan><tspan fill="#94a3b8">cpu.pipeline = </tspan><tspan fill="#f59e0b" font-weight="700">RV32I_5_STAGE</tspan>
      <tspan fill="#64748b"> │ </tspan><tspan fill="#94a3b8">rust.safety = </tspan><tspan fill="#38bdf8" font-weight="700">STRICT</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- ACTIVE PROMPT & BLINKING CURSOR                                       -->
  <!-- ===================================================================== -->
  <g class="anim-line-4">
    <text x="24" y="236" class="term-font">
      <tspan fill="#34d399">utkarsh@syslab</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$ </tspan>
      <tspan fill="#38bdf8">build --all --release</tspan>
    </text>
    <rect x="238" y="225" width="8" height="14" fill="#38bdf8" class="cursor-active" />
  </g>
</svg>
