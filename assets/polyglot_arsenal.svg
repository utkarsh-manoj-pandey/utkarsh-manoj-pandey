<svg width="900" height="140" viewBox="0 0 900 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arsenalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>

    <!-- Grid -->
    <pattern id="arsGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#121d2e" stroke-width="0.5" />
    </pattern>
  </defs>

  <style>
    .ars-hdr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .chip-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .chip-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8.5px;
      fill: #94a3b8;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="138" rx="8" fill="url(#arsenalBg)" stroke="#1a2538" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="136" rx="7" fill="url(#arsGrid)" />

  <!-- Top Bar -->
  <rect x="1" y="1" width="898" height="26" rx="8" fill="#0b101a" />
  <line x1="1" y1="26" x2="899" y2="26" stroke="#1a2538" stroke-width="1" />
  <text x="24" y="17" class="ars-hdr" fill="#38bdf8">ENGINEERING ARSENAL // HARDWARE, RUNTIMES &amp; SYSTEMS LANGUAGES</text>
  <text x="876" y="17" class="ars-hdr" fill="#64748b" text-anchor="end">PRODUCTION CAPABILITY</text>

  <!-- Chip 1: RUST -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="162" height="78" rx="6" fill="#090f1a" stroke="#1e2c44" stroke-width="1" />
    <!-- IC Pins Top -->
    <rect x="20" y="-3" width="8" height="3" fill="#38bdf8" />
    <rect x="40" y="-3" width="8" height="3" fill="#38bdf8" />
    <rect x="114" y="-3" width="8" height="3" fill="#38bdf8" />
    <rect x="134" y="-3" width="8" height="3" fill="#38bdf8" />
    <text x="14" y="22" class="ars-hdr" fill="#38bdf8">SYSTEMS RUNTIME</text>
    <text x="14" y="42" class="chip-title">Rust</text>
    <text x="14" y="58" class="chip-sub">Zero-Cost Abstractions</text>
    <text x="14" y="70" class="chip-sub">Memory Safety • Tokio Async</text>
  </g>

  <!-- Chip 2: C++20 -->
  <g transform="translate(196, 40)">
    <rect x="0" y="0" width="162" height="78" rx="6" fill="#090f1a" stroke="#1e2c44" stroke-width="1" />
    <rect x="20" y="-3" width="8" height="3" fill="#60a5fa" />
    <rect x="40" y="-3" width="8" height="3" fill="#60a5fa" />
    <rect x="114" y="-3" width="8" height="3" fill="#60a5fa" />
    <rect x="134" y="-3" width="8" height="3" fill="#60a5fa" />
    <text x="14" y="22" class="ars-hdr" fill="#60a5fa">HIGH PERFORMANCE</text>
    <text x="14" y="42" class="chip-title">Modern C++20</text>
    <text x="14" y="58" class="chip-sub">SIMD Vectorization (AVX2)</text>
    <text x="14" y="70" class="chip-sub">Multi-Thread Media Pipelines</text>
  </g>

  <!-- Chip 3: PYTHON -->
  <g transform="translate(368, 40)">
    <rect x="0" y="0" width="162" height="78" rx="6" fill="#090f1a" stroke="#1e2c44" stroke-width="1" />
    <rect x="20" y="-3" width="8" height="3" fill="#34d399" />
    <rect x="40" y="-3" width="8" height="3" fill="#34d399" />
    <rect x="114" y="-3" width="8" height="3" fill="#34d399" />
    <rect x="134" y="-3" width="8" height="3" fill="#34d399" />
    <text x="14" y="22" class="ars-hdr" fill="#34d399">LOCAL-FIRST SUITE</text>
    <text x="14" y="42" class="chip-title">Python 3.11+</text>
    <text x="14" y="58" class="chip-sub">Encrypted SQLite • Qt/PySide</text>
    <text x="14" y="70" class="chip-sub">Zero-Telemetry Utilities</text>
  </g>

  <!-- Chip 4: VHDL -->
  <g transform="translate(540, 40)">
    <rect x="0" y="0" width="162" height="78" rx="6" fill="#090f1a" stroke="#1e2c44" stroke-width="1" />
    <rect x="20" y="-3" width="8" height="3" fill="#f59e0b" />
    <rect x="40" y="-3" width="8" height="3" fill="#f59e0b" />
    <rect x="114" y="-3" width="8" height="3" fill="#f59e0b" />
    <rect x="134" y="-3" width="8" height="3" fill="#f59e0b" />
    <text x="14" y="22" class="ars-hdr" fill="#f59e0b">HARDWARE SILICON</text>
    <text x="14" y="42" class="chip-title">VHDL</text>
    <text x="14" y="58" class="chip-sub">RTL Synthesis &amp; Testbenches</text>
    <text x="14" y="70" class="chip-sub">Bus Interconnects • Peripherals</text>
  </g>

  <!-- Chip 5: RISC-V & LINUX -->
  <g transform="translate(712, 40)">
    <rect x="0" y="0" width="164" height="78" rx="6" fill="#090f1a" stroke="#1e2c44" stroke-width="1" />
    <rect x="20" y="-3" width="8" height="3" fill="#818cf8" />
    <rect x="40" y="-3" width="8" height="3" fill="#818cf8" />
    <rect x="114" y="-3" width="8" height="3" fill="#818cf8" />
    <rect x="134" y="-3" width="8" height="3" fill="#818cf8" />
    <text x="14" y="22" class="ars-hdr" fill="#818cf8">ISA &amp; RUNTIME</text>
    <text x="14" y="42" class="chip-title">RISC-V / POSIX</text>
    <text x="14" y="58" class="chip-sub">RV32I Base Integer ISA</text>
    <text x="14" y="70" class="chip-sub">Linux Internals • Shell / C</text>
  </g>
</svg>
