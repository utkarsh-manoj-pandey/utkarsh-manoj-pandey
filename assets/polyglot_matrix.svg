<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
  </defs>

  <style>
    .t-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .t-head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .t-body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
  </style>

  <!-- 4 Modular Polyglot Columns -->
  <!-- Column 1: Systems & Low-Level -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="204" height="152" rx="8" fill="url(#matrixCardBg)" stroke="#1a2436" stroke-width="1" />
    <rect x="0" y="0" width="204" height="28" rx="8" fill="#0d1424" />
    <line x1="0" y1="28" x2="204" y2="28" stroke="#1a2436" stroke-width="0.8" />
    <text x="12" y="18" class="t-code" fill="#38bdf8">01 // SYSTEMS &amp; LOW-LEVEL</text>

    <text x="12" y="52" class="t-head">C • C++ • Rust • Go</text>
    <text x="12" y="70" class="t-body">Pro*C • Bash / Shell Script</text>
    <text x="12" y="90" class="t-body" fill="#64748b">Architecture: RISC-V ISA</text>
    <text x="12" y="110" class="t-body" fill="#64748b">Pipelines &amp; Microarchitecture</text>
    <text x="12" y="132" class="t-body" fill="#38bdf8">ARM64 • x86_64 Kernel Config</text>
  </g>

  <!-- Column 2: AI & Scientific Computing -->
  <g transform="translate(236, 14)">
    <rect x="0" y="0" width="204" height="152" rx="8" fill="url(#matrixCardBg)" stroke="#1a2436" stroke-width="1" />
    <rect x="0" y="0" width="204" height="28" rx="8" fill="#0d1424" />
    <line x1="0" y1="28" x2="204" y2="28" stroke="#1a2436" stroke-width="0.8" />
    <text x="12" y="18" class="t-code" fill="#818cf8">02 // AI &amp; SCIENTIFIC</text>

    <text x="12" y="52" class="t-head">Python • Julia • R</text>
    <text x="12" y="70" class="t-body">Scala • Java • PyTorch</text>
    <text x="12" y="90" class="t-body" fill="#64748b">Fine-Tuning: Llama 3.3</text>
    <text x="12" y="110" class="t-body" fill="#64748b">DeepSeek R1 • Multimodal</text>
    <text x="12" y="132" class="t-body" fill="#818cf8">Scikit-Learn • NLP • Vision</text>
  </g>

  <!-- Column 3: Automation & Desktop Applications -->
  <g transform="translate(454, 14)">
    <rect x="0" y="0" width="204" height="152" rx="8" fill="url(#matrixCardBg)" stroke="#1a2436" stroke-width="1" />
    <rect x="0" y="0" width="204" height="28" rx="8" fill="#0d1424" />
    <line x1="0" y1="28" x2="204" y2="28" stroke="#1a2436" stroke-width="0.8" />
    <text x="12" y="18" class="t-code" fill="#34d399">03 // AUTOMATION &amp; APPS</text>

    <text x="12" y="52" class="t-head">Playwright • Selenium</text>
    <text x="12" y="70" class="t-body">PyQt Desktop GUIs</text>
    <text x="12" y="90" class="t-body" fill="#64748b">Continuous ASR Voice Control</text>
    <text x="12" y="110" class="t-body" fill="#64748b">Autonomous Web Workflows</text>
    <text x="12" y="132" class="t-body" fill="#34d399">Real-Time Event Loops</text>
  </g>

  <!-- Column 4: Databases & Edge Storage -->
  <g transform="translate(672, 14)">
    <rect x="0" y="0" width="208" height="152" rx="8" fill="url(#matrixCardBg)" stroke="#1a2436" stroke-width="1" />
    <rect x="0" y="0" width="208" height="28" rx="8" fill="#0d1424" />
    <line x1="0" y1="28" x2="208" y2="28" stroke="#1a2436" stroke-width="0.8" />
    <text x="12" y="18" class="t-code" fill="#f59e0b">04 // DATA &amp; STORAGE</text>

    <text x="12" y="52" class="t-head">SQLite • PostgreSQL</text>
    <text x="12" y="70" class="t-body">OracleDB • SQL Server</text>
    <text x="12" y="90" class="t-body" fill="#64748b">MongoDB (NoSQL) • Pro*C</text>
    <text x="12" y="110" class="t-body" fill="#64748b">Audio-Visual Dataset Stores</text>
    <text x="12" y="132" class="t-body" fill="#f59e0b">ETL &amp; NVMe I/O Pipelines</text>
  </g>
</svg>
