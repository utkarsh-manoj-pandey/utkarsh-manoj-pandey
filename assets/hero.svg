<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Center Flare -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#101726" stroke-width="0.8" />
    </pattern>

    <!-- Linear Gradient for Name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.35; transform: scale(0.85); filter: none; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    .live-dot {
      transform-origin: 846px 24px;
      animation: pulseGreen 2s infinite ease-in-out;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Technical Grid -->
  <rect x="2" y="2" width="896" height="276" rx="11" fill="url(#techGrid)" opacity="0.9" />

  <!-- Center Ambient Glow -->
  <circle cx="450" cy="130" r="300" fill="url(#centerGlow)" />

  <!-- Terminal Window Chrome Bar -->
  <rect x="1" y="1" width="898" height="42" rx="12" fill="#0c1017" fill-opacity="0.8" />
  <line x1="1" y1="43" x2="899" y2="43" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="28" cy="22" r="5" fill="#ef4444" />
  <circle cx="46" cy="22" r="5" fill="#f59e0b" />
  <circle cx="64" cy="22" r="5" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="92" y="26" class="font-mono" font-size="11" fill="#64748b" letter-spacing="1">utkarsh-manoj-pandey@workstation: ~/neural-core</text>

  <!-- Top Right Status -->
  <g>
    <circle cx="846" cy="22" r="4" fill="#10b981" class="live-dot" />
    <text x="834" y="26" class="font-mono" font-size="11" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.5">SYSTEM ACTIVE</text>
  </g>

  <!-- Masthead Content (Centered) -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Sub-badge -->
    <rect x="-180" y="-18" width="360" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-2" class="font-mono" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="2">AI &amp; DATA SYSTEMS ARCHITECT</text>

    <!-- Main Name -->
    <text x="0" y="44" class="font-sans" font-size="40" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Tagline -->
    <text x="0" y="74" class="font-mono" font-size="12" fill="#94a3b8" letter-spacing="1">Translating Stochastic Data into High-Precision Algorithmic Intelligence</text>
  </g>

  <!-- Four Bottom Modular Pillars -->
  <g transform="translate(25, 205)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="202" height="52" rx="6" fill="#080c14" stroke="#1a2333" stroke-width="1" />
    <text x="14" y="20" class="font-mono" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1">01 / DEEP LEARNING</text>
    <text x="14" y="38" class="font-sans" font-size="11" fill="#e2e8f0" font-weight="500">PyTorch • LSTM • NLP</text>

    <!-- Pillar 2 -->
    <rect x="216" y="0" width="202" height="52" rx="6" fill="#080c14" stroke="#1a2333" stroke-width="1" />
    <text x="230" y="20" class="font-mono" font-size="9.5" fill="#818cf8" font-weight="700" letter-spacing="1">02 / QUANT FINANCE</text>
    <text x="230" y="38" class="font-sans" font-size="11" fill="#e2e8f0" font-weight="500">Risk Analytics • Series</text>

    <!-- Pillar 3 -->
    <rect x="432" y="0" width="202" height="52" rx="6" fill="#080c14" stroke="#1a2333" stroke-width="1" />
    <text x="446" y="20" class="font-mono" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1">03 / DATA SYSTEMS</text>
    <text x="446" y="38" class="font-sans" font-size="11" fill="#e2e8f0" font-weight="500">Automated Web Crawlers</text>

    <!-- Pillar 4 -->
    <rect x="648" y="0" width="202" height="52" rx="6" fill="#080c14" stroke="#1a2333" stroke-width="1" />
    <text x="662" y="20" class="font-mono" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="1">04 / ARCHITECTURE</text>
    <text x="662" y="38" class="font-sans" font-size="11" fill="#e2e8f0" font-weight="500">FastAPI • Production APIs</text>
  </g>
</svg>
