<svg width="900" height="74" viewBox="0 0 900 74" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="launchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="launchBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .pulse-dot { animation: pulseGlow 1.8s infinite ease-in-out; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="898" height="72" rx="10" fill="url(#launchBg)" stroke="url(#launchBorder)" stroke-width="1.2" />

  <!-- Left: OS Icon & Identity -->
  <g transform="translate(24, 18)">
    <!-- Terminal / OS Icon Box -->
    <rect width="38" height="38" rx="8" fill="#0d182e" stroke="#38bdf8" stroke-width="1" />
    <text x="19" y="24" class="font-mono" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="700">&gt;_</text>
    <circle cx="31" cy="7" r="3" fill="#10b981" class="pulse-dot" />

    <!-- Text Group -->
    <g transform="translate(50, 0)">
      <text y="14" class="font-mono" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="1">PROMETHEUS-OS v6.12 // WEB RUNTIME READY</text>
      <text y="32" class="font-sans" font-size="11.5" fill="#94a3b8">Single-File Web Operating System • 3D Cyber Desktop • Interactive SIFRA AI &amp; zsh CLI</text>
    </g>
  </g>

  <!-- Right: Glowing Launch Button Pill -->
  <g transform="translate(680, 19)">
    <rect width="196" height="36" rx="8" fill="url(#btnGrad)" />
    <text x="98" y="22" class="font-mono" font-size="11" fill="#04060c" text-anchor="middle" font-weight="800" letter-spacing="1">LAUNCH WEB DESKTOP ↗</text>
  </g>
</svg>
