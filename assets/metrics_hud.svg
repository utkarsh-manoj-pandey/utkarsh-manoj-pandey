<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="sparkArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <pattern id="hudGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#111827" stroke-width="0.7" />
    </pattern>
  </defs>

  <style>
    @keyframes drawPath {
      0% { stroke-dashoffset: 400; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes pulsePoint {
      0%, 100% { r: 3; opacity: 1; }
      50% { r: 5; opacity: 0.4; }
    }
    .hud-title {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #64748b;
    }
    .hud-stat {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: #f8fafc;
    }
    .hud-desc {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
    .anim-curve {
      stroke-dasharray: 400;
      animation: drawPath 6s linear infinite;
    }
    .convergence-node {
      animation: pulsePoint 2s infinite ease-in-out;
    }
  </style>

  <!-- Border & Base -->
  <rect x="1" y="1" width="898" height="148" rx="8" fill="url(#hudBg)" stroke="#1e293b" stroke-width="1" />
  <rect x="2" y="2" width="896" height="146" rx="7" fill="url(#hudGrid)" />

  <!-- Module 1: Production Reliability & Code Volume -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="hud-title">01 // PRODUCTION ARCHITECTURE</text>
    <text x="0" y="30" class="hud-stat">3+ YEARS <tspan font-size="12" fill="#38bdf8">EXPERIENCE</tspan></text>
    <text x="0" y="52" class="hud-desc">Specialized in Python &amp; Data Engineering</text>
    <text x="0" y="70" class="hud-desc" fill="#64748b">Pipelines • Microservices • REST Endpoints</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="290" y1="20" x2="290" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Module 2: AI / ML Pipeline Telemetry -->
  <g transform="translate(315, 28)">
    <text x="0" y="0" class="hud-title">02 // RESEARCH &amp; MODELING PIPELINE</text>
    <text x="0" y="30" class="hud-stat">&lt; 0.012 <tspan font-size="12" fill="#818cf8">CONVERGENCE LOSS</tspan></text>
    <text x="0" y="52" class="hud-desc">NLP (LSTM), Scikit-Learn, PyTorch</text>
    <text x="0" y="70" class="hud-desc" fill="#64748b">Sentiment Mining • Quantitative Finance</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="580" y1="20" x2="580" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Module 3: Active Sparkline / Optimization Convergence Graph -->
  <g transform="translate(605, 24)">
    <text x="0" y="4" class="hud-title">03 // OPTIMIZATION CONVERGENCE</text>
    <text x="250" y="4" class="hud-title" text-anchor="end" fill="#34d399">● OPTIMAL</text>

    <!-- Sparkline Frame -->
    <rect x="0" y="16" width="250" height="70" rx="4" fill="#080c14" stroke="#1a2333" stroke-width="0.8" />
    
    <!-- Grid hairlines inside chart -->
    <line x1="0" y1="39" x2="250" y2="39" stroke="#131c2e" stroke-width="0.6" stroke-dasharray="2 4" />
    <line x1="0" y1="62" x2="250" y2="62" stroke="#131c2e" stroke-width="0.6" stroke-dasharray="2 4" />
    <line x1="125" y1="16" x2="125" y2="86" stroke="#131c2e" stroke-width="0.6" stroke-dasharray="2 4" />

    <!-- Animated Smooth Bezier Loss Curve -->
    <path d="M 10 70 Q 50 65, 80 40 T 150 28 T 200 25 T 240 22" fill="none" stroke="url(#curveGrad)" stroke-width="2" class="anim-curve" />
    <circle cx="240" cy="22" r="3.5" fill="#34d399" class="convergence-node" />

    <text x="6" y="80" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">EPOCH 0</text>
    <text x="244" y="80" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399" text-anchor="end">CONVERGED</text>
  </g>
</svg>
