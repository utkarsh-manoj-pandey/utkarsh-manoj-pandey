<svg width="900" height="74" viewBox="0 0 900 74" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="credBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
  </defs>

  <style>
    .c-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #64748b;
    }
    .c-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #f8fafc;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="72" rx="8" fill="url(#credBg)" stroke="#1a2538" stroke-width="1.2" />

  <!-- Credential 1: ISRO -->
  <g transform="translate(24, 24)">
    <text class="c-label">ACCREDITATION // RESEARCH</text>
    <text y="22" class="c-val" fill="#f59e0b">ISRO</text>
    <text x="44" y="22" class="c-val" fill="#cbd5e1" font-weight="500">GIS Certified</text>
  </g>

  <line x1="205" y1="14" x2="205" y2="60" stroke="#162032" stroke-width="1" />

  <!-- Credential 2: IIT Madras -->
  <g transform="translate(225, 24)">
    <text class="c-label">ACADEMIC EXCELLENCE</text>
    <text y="22" class="c-val" fill="#38bdf8">IIT MADRAS</text>
    <text x="86" y="22" class="c-val" fill="#cbd5e1" font-weight="500">Data Science</text>
  </g>

  <line x1="435" y1="14" x2="435" y2="60" stroke="#162032" stroke-width="1" />

  <!-- Credential 3: AWS & Google -->
  <g transform="translate(455, 24)">
    <text class="c-label">INDUSTRY CERTIFICATION</text>
    <text y="22" class="c-val" fill="#818cf8">AWS</text>
    <text x="36" y="22" class="c-val" fill="#cbd5e1" font-weight="500">• Google Certified</text>
  </g>

  <line x1="660" y1="14" x2="660" y2="60" stroke="#162032" stroke-width="1" />

  <!-- Credential 4: M.Sc. IT Grant -->
  <g transform="translate(680, 24)">
    <text class="c-label">POSTGRADUATE DEGREE</text>
    <text y="22" class="c-val" fill="#10b981">M.Sc. IT (CGPA 8.7)</text>
    <text x="135" y="22" class="c-val" fill="#64748b" font-weight="500">Grant Winner</text>
  </g>
</svg>
