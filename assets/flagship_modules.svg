<svg width="900" height="740" viewBox="0 0 900 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient matching GitHub Dark Theme -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c16" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>

    <!-- Glow & Accents -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="amberBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="indigoBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="roseBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .module-card { transition: all 0.3s ease; }
  </style>

  <!-- Master Canvas Outer Shell -->
  <rect x="1" y="1" width="898" height="738" rx="12" fill="url(#deckBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Deck Titlebar -->
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#080d19" />
  <line x1="1" y1="38" x2="899" y2="38" stroke="#1e293b" stroke-width="1" />

  <circle cx="22" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="54" cy="19" r="4.5" fill="#10b981" />

  <text x="80" y="23" class="font-mono" font-size="11" fill="#64748b" font-weight="600">FLAGSHIP_SYSTEMS // PRODUCTION ARCHITECTURE SPECIFICATION</text>
  <text x="876" y="23" class="font-mono" font-size="10" fill="#38bdf8" text-anchor="end" font-weight="600">5 ACTIVE REPOSITORIES</text>

  <!-- ===================================================================== -->
  <!-- MODULE CARD 01: PRIVACY-FIRST PERSONAL SPACE (y: 52, h: 122)          -->
  <!-- ===================================================================== -->
  <g transform="translate(18, 52)">
    <rect width="864" height="122" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#emeraldBorder)" stroke-width="2.5" />

    <!-- Left Column: Identity & Stack -->
    <text x="20" y="28" class="font-mono" font-size="10" fill="#10b981" font-weight="700" letter-spacing="1">01 // LOCAL-FIRST WORKSPACE</text>
    <text x="20" y="52" class="font-sans" font-size="16" fill="#ffffff" font-weight="800">Privacy-First Personal Space</text>
    
    <!-- Language & Status Badges -->
    <rect x="20" y="68" width="85" height="20" rx="4" fill="#0b1b13" stroke="#10b981" stroke-width="0.8" />
    <text x="62" y="82" class="font-mono" font-size="10" fill="#34d399" text-anchor="middle" font-weight="600">Python 3.11+</text>

    <rect x="112" y="68" width="95" height="20" rx="4" fill="#111928" stroke="#334155" stroke-width="0.8" />
    <text x="159" y="82" class="font-mono" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">STATUS: PLANNED</text>

    <!-- Vertical Separator -->
    <line x1="250" y1="16" x2="250" y2="106" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Right Column: Architecture & Scope -->
    <text x="272" y="32" class="font-sans" font-size="13" fill="#e2e8f0" font-weight="600">Complete Offline-First Desktop Environment &amp; Application Suite</text>
    <text x="272" y="56" class="font-sans" font-size="11.5" fill="#94a3b8">
      A complete local-first desktop application with integrated browser, encrypted notes, local calendar, media player,
    </text>
    <text x="272" y="74" class="font-sans" font-size="11.5" fill="#94a3b8">
      documents vault, internet radio, weather, curated news feeds, file utilities, and zero-leak privacy controls.
    </text>

    <!-- Subsystem Tags -->
    <text x="272" y="102" class="font-mono" font-size="9.5" fill="#64748b">
      <tspan fill="#34d399">#EncryptedStorage</tspan>   
      <tspan fill="#38bdf8">#LocalFirst</tspan>   
      <tspan fill="#a78bfa">#DesktopSuite</tspan>   
      <tspan fill="#cbd5e1">#ZeroTelemetry</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- MODULE CARD 02: NØRVA (y: 186, h: 122)                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(18, 186)">
    <rect width="864" height="122" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#cyanBorder)" stroke-width="2.5" />

    <!-- Left Column: Identity & Stack -->
    <text x="20" y="28" class="font-mono" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">02 // PRIVACY BROWSER ENGINE</text>
    <text x="20" y="52" class="font-sans" font-size="16" fill="#ffffff" font-weight="800">NØRVA</text>
    
    <!-- Language & Status Badges -->
    <rect x="20" y="68" width="60" height="20" rx="4" fill="#081827" stroke="#38bdf8" stroke-width="0.8" />
    <text x="50" y="82" class="font-mono" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">Rust</text>

    <rect x="88" y="68" width="95" height="20" rx="4" fill="#111928" stroke="#334155" stroke-width="0.8" />
    <text x="135" y="82" class="font-mono" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">STATUS: PLANNED</text>

    <!-- Vertical Separator -->
    <line x1="250" y1="16" x2="250" y2="106" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Right Column: Architecture & Scope -->
    <text x="272" y="32" class="font-sans" font-size="13" fill="#e2e8f0" font-weight="600">Lightweight, Memory-Safe Privacy Browser Engine</text>
    <text x="272" y="56" class="font-sans" font-size="11.5" fill="#94a3b8">
      Engineered for uncompromising privacy: native tracker protection, isolated session containers, fine-grained
    </text>
    <text x="272" y="74" class="font-sans" font-size="11.5" fill="#94a3b8">
      permission controls, real-time privacy dashboard, secure download manager, and localized encrypted browsing history.
    </text>

    <!-- Subsystem Tags -->
    <text x="272" y="102" class="font-mono" font-size="9.5" fill="#64748b">
      <tspan fill="#38bdf8">#RustEngine</tspan>   
      <tspan fill="#34d399">#TrackerShield</tspan>   
      <tspan fill="#a78bfa">#SessionIsolation</tspan>   
      <tspan fill="#cbd5e1">#MemorySafety</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- MODULE CARD 03: KODAI (y: 320, h: 122)                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(18, 320)">
    <rect width="864" height="122" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#indigoBorder)" stroke-width="2.5" />

    <!-- Left Column: Identity & Stack -->
    <text x="20" y="28" class="font-mono" font-size="10" fill="#818cf8" font-weight="700" letter-spacing="1">03 // AUTONOMOUS AI AGENT</text>
    <text x="20" y="52" class="font-sans" font-size="16" fill="#ffffff" font-weight="800">KODAI</text>
    
    <!-- Language & Status Badges -->
    <rect x="20" y="68" width="60" height="20" rx="4" fill="#131433" stroke="#818cf8" stroke-width="0.8" />
    <text x="50" y="82" class="font-mono" font-size="10" fill="#818cf8" text-anchor="middle" font-weight="600">Rust</text>

    <rect x="88" y="68" width="95" height="20" rx="4" fill="#111928" stroke="#334155" stroke-width="0.8" />
    <text x="135" y="82" class="font-mono" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">STATUS: PLANNED</text>

    <!-- Vertical Separator -->
    <line x1="250" y1="16" x2="250" y2="106" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Right Column: Architecture & Scope -->
    <text x="272" y="32" class="font-sans" font-size="13" fill="#e2e8f0" font-weight="600">Low-RAM, Model-Agnostic Autonomous Coding Agent</text>
    <text x="272" y="56" class="font-sans" font-size="11.5" fill="#94a3b8">
      A lightweight coding AI runtime built to connect to local coding LLMs or external inference APIs. Operates directly
    </text>
    <text x="272" y="74" class="font-sans" font-size="11.5" fill="#94a3b8">
      on real codebases with sandboxed tool execution, deterministic workspace mutation, and strict RAM footprints.
    </text>

    <!-- Subsystem Tags -->
    <text x="272" y="102" class="font-mono" font-size="9.5" fill="#64748b">
      <tspan fill="#818cf8">#AutonomousAgent</tspan>   
      <tspan fill="#38bdf8">#ModelAgnostic</tspan>   
      <tspan fill="#34d399">#SandboxedTools</tspan>   
      <tspan fill="#cbd5e1">#LowRAM</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- MODULE CARD 04: VECTRA (y: 454, h: 122)                                -->
  <!-- ===================================================================== -->
  <g transform="translate(18, 454)">
    <rect width="864" height="122" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#roseBorder)" stroke-width="2.5" />

    <!-- Left Column: Identity & Stack -->
    <text x="20" y="28" class="font-mono" font-size="10" fill="#f43f5e" font-weight="700" letter-spacing="1">04 // HIGH-PERFORMANCE MEDIA SUITE</text>
    <text x="20" y="52" class="font-sans" font-size="16" fill="#ffffff" font-weight="800">VECTRA</text>
    
    <!-- Language & Status Badges -->
    <rect x="20" y="68" width="95" height="20" rx="4" fill="#250d18" stroke="#f43f5e" stroke-width="0.8" />
    <text x="67" y="82" class="font-mono" font-size="9.5" fill="#fb7185" text-anchor="middle" font-weight="600">Modern C++20</text>

    <rect x="122" y="68" width="95" height="20" rx="4" fill="#111928" stroke="#334155" stroke-width="0.8" />
    <text x="169" y="82" class="font-mono" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">STATUS: PLANNED</text>

    <!-- Vertical Separator -->
    <line x1="250" y1="16" x2="250" y2="106" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Right Column: Architecture & Scope -->
    <text x="272" y="32" class="font-sans" font-size="13" fill="#e2e8f0" font-weight="600">Hardware-Accelerated Audio/Video Analysis &amp; Transcoding</text>
    <text x="272" y="56" class="font-sans" font-size="11.5" fill="#94a3b8">
      A high-performance media processing engine: lightning-fast video/audio conversion, modern compression algorithms,
    </text>
    <text x="272" y="74" class="font-sans" font-size="11.5" fill="#94a3b8">
      deep metadata extraction, subtitle demuxing/generation, batch pipeline execution, and forensic container inspection.
    </text>

    <!-- Subsystem Tags -->
    <text x="272" y="102" class="font-mono" font-size="9.5" fill="#64748b">
      <tspan fill="#f43f5e">#ModernCpp20</tspan>   
      <tspan fill="#38bdf8">#SIMDParallel</tspan>   
      <tspan fill="#34d399">#MediaInspection</tspan>   
      <tspan fill="#cbd5e1">#BatchPipeline</tspan>
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- MODULE CARD 05: VERA-32 (y: 588, h: 122)                               -->
  <!-- ===================================================================== -->
  <g transform="translate(18, 588)">
    <rect width="864" height="122" rx="8" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#amberBorder)" stroke-width="2.5" />

    <!-- Left Column: Identity & Stack -->
    <text x="20" y="28" class="font-mono" font-size="10" fill="#f59e0b" font-weight="700" letter-spacing="1">05 // MICROCONTROLLER SOC &amp; SILICON</text>
    <text x="20" y="52" class="font-sans" font-size="16" fill="#ffffff" font-weight="800">VERA-32</text>
    
    <!-- Language & Status Badges -->
    <rect x="20" y="68" width="105" height="20" rx="4" fill="#241808" stroke="#f59e0b" stroke-width="0.8" />
    <text x="72" y="82" class="font-mono" font-size="9.5" fill="#fbbf24" text-anchor="middle" font-weight="600">VHDL • RISC-V</text>

    <rect x="132" y="68" width="95" height="20" rx="4" fill="#111928" stroke="#334155" stroke-width="0.8" />
    <text x="179" y="82" class="font-mono" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="500">STATUS: PLANNED</text>

    <!-- Vertical Separator -->
    <line x1="250" y1="16" x2="250" y2="106" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Right Column: Architecture & Scope -->
    <text x="272" y="32" class="font-sans" font-size="13" fill="#e2e8f0" font-weight="600">Custom 32-Bit RISC-V Microcontroller SoC &amp; RTL Subsystems</text>
    <text x="272" y="56" class="font-sans" font-size="11.5" fill="#94a3b8">
      Complete custom 32-bit RISC-V microcontroller SoC: RV32I CPU core, boot ROM, SRAM controller, system bus, GPIO,
    </text>
    <text x="272" y="74" class="font-sans" font-size="11.5" fill="#94a3b8">
      UART, SPI, I²C, hardware timers, nested interrupts, bare-metal C firmware support, GHDL simulation, and FPGA target.
    </text>

    <!-- Subsystem Tags -->
    <text x="272" y="102" class="font-mono" font-size="9.5" fill="#64748b">
      <tspan fill="#f59e0b">#RV32I</tspan>   
      <tspan fill="#38bdf8">#VHDL_RTL</tspan>   
      <tspan fill="#34d399">#SoCPeripherals</tspan>   
      <tspan fill="#cbd5e1">#FPGASynthesis</tspan>
    </text>
  </g>
</svg>
