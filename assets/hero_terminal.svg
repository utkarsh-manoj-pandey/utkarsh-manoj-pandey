<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient blending seamlessly into GitHub dark mode (#0d1117) -->
    <linearGradient id="gitDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Sleek border stroke -->
    <linearGradient id="borderAura" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="auroraLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Circuit Pattern -->
    <pattern id="circuitPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162235" stroke-width="0.7" />
      <circle cx="12" cy="12" r="0.6" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Name Metallic Gradient -->
    <linearGradient id="nameMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px #10b981); }
      50% { opacity: 0.3; transform: scale(0.85); filter: none; }
    }
    @keyframes laserPass {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(950px); }
    }
    .pulse-node {
      transform-origin: 846px 21px;
      animation: liveBlink 2.2s infinite ease-in-out;
    }
    .laser-scan {
      animation: laserPass 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .mono-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .sans-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="url(#gitDarkBg)" stroke="url(#borderAura)" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="276" rx="11" fill="url(#circuitPattern)" />
  <circle cx="450" cy="130" r="280" fill="url(#auroraLight)" />

  <!-- Window Chrome Top Bar -->
  <rect x="1" y="1" width="898" height="42" rx="12" fill="#0b0f17" fill-opacity="0.9" />
  <line x1="1" y1="42" x2="899" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Control Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <!-- Terminal Breadcrumb -->
  <text x="88" y="25" class="mono-font" font-size="11" fill="#64748b" letter-spacing="1">prometheus-os :: arm64-v8a // workstation-kernel</text>

  <!-- Status Beacon -->
  <circle cx="846" cy="21" r="4" fill="#10b981" class="pulse-node" />
  <text x="834" y="25" class="mono-font" font-size="10.5" fill="#38bdf8" text-anchor="end" font-weight="600" letter-spacing="1.5">ONLINE // OPTIMAL</text>

  <!-- Laser Scanline beneath header bar -->
  <g clip-path="url(#scanClip)">
    <clipPath id="scanClip">
      <rect x="1" y="42" width="898" height="2" />
    </clipPath>
    <rect x="0" y="42" width="240" height="2" fill="url(#laserGrad)" class="laser-scan" />
  </g>

  <!-- ===================================================================== -->
  <!-- HERO IDENTITY (Centered with ample breathing room)                    -->
  <!-- ===================================================================== -->
  <g transform="translate(450, 102)" text-anchor="middle">
    <!-- Role Badge -->
    <rect x="-195" y="-18" width="390" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="-2" class="mono-font" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="1.8">AI &amp; INTELLIGENT SYSTEMS DEVELOPER</text>

    <!-- Main Name Title -->
    <text x="0" y="46" class="sans-font" font-size="42" font-weight="800" fill="url(#nameMetallic)" letter-spacing="-0.5">UTKARSH MANOJ PANDEY</text>

    <!-- Core Specialization Line -->
    <text x="0" y="74" class="mono-font" font-size="11" fill="#94a3b8" letter-spacing="1">Edge AI • Autonomous Voice Agents • Custom Linux OS Kernel • RISC-V</text>
  </g>

  <!-- ===================================================================== -->
  <!-- 3 SPEC PILLARS (Bottom Row with generous 280px widths)               -->
  <!-- ===================================================================== -->
  <!-- Pillar 1: SIFRA Voice Agent -->
  <g transform="translate(24, 202)">
    <rect x="0" y="0" width="268" height="58" rx="8" fill="#080d16" stroke="#1e2c44" stroke-width="1" />
    <text x="14" y="22" class="mono-font" font-size="9.5" fill="#38bdf8" font-weight="700" letter-spacing="1">01 / AUTONOMOUS VOICE AI</text>
    <text x="14" y="42" class="sans-font" font-size="12" fill="#f8fafc" font-weight="600">SIFRA &amp; Fine-Tuned LLMs</text>
    <text x="180" y="42" class="mono-font" font-size="9.5" fill="#64748b">Llama 3.3 • R1</text>
  </g>

  <!-- Pillar 2: Prometheus OS -->
  <g transform="translate(316, 202)">
    <rect x="0" y="0" width="268" height="58" rx="8" fill="#080d16" stroke="#1e2c44" stroke-width="1" />
    <text x="14" y="22" class="mono-font" font-size="9.5" fill="#818cf8" font-weight="700" letter-spacing="1">02 / CUSTOM LINUX OPERATING SYSTEM</text>
    <text x="14" y="42" class="sans-font" font-size="12" fill="#f8fafc" font-weight="600">Prometheus OS</text>
    <text x="135" y="42" class="mono-font" font-size="9.5" fill="#64748b">Arch Linux • ARM64/x86</text>
  </g>

  <!-- Pillar 3: Hardware Rig & NVMe -->
  <g transform="translate(608, 202)">
    <rect x="0" y="0" width="268" height="58" rx="8" fill="#080d16" stroke="#1e2c44" stroke-width="1" />
    <text x="14" y="22" class="mono-font" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="1">03 / HARDWARE &amp; ARCHITECTURE</text>
    <text x="14" y="42" class="sans-font" font-size="12" fill="#f8fafc" font-weight="600">RPi 5 + M.2 NVMe SSD</text>
    <text x="175" y="42" class="mono-font" font-size="9.5" fill="#64748b">RISC-V ISA</text>
  </g>
</svg>
